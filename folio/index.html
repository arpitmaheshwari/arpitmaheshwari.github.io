<script defer src="../analytics.js?v=4f9aa0a0"></script>
<script>
  // This page exists to count the PDF click-through and hand over to the
  // homepage. The redirect timer starts NOW so the reader never waits on
  // analytics; the event is fired on DOMContentLoaded, which is after the
  // deferred analytics.js has defined gtag.
  (function () {
    var done = false;
    function go() {
      if (done) return; done = true;
      window.location.replace('/?utm_source=folio&utm_medium=pdf&utm_campaign=portfolio-pdf');
    }
    setTimeout(go, 500);            // never leave the reader waiting
    document.addEventListener('DOMContentLoaded', function () {
      window.gtag('event', 'folio_open', {
        event_category: 'pdf',
        event_label: 'portfolio-pdf',
        transport_type: 'beacon',
        event_callback: go
      });
    });
  })();
</script>
