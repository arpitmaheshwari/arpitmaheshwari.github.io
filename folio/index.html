<script async src="https://www.googletagmanager.com/gtag/js?id=G-PFY6ME99K8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PFY6ME99K8', { transport_type: 'beacon' });

  // Count the PDF click-through, then hand over to the homepage.
  (function () {
    var done = false;
    function go() {
      if (done) return; done = true;
      window.location.replace('/?utm_source=folio&utm_medium=pdf&utm_campaign=portfolio-pdf');
    }
    gtag('event', 'folio_open', {
      event_category: 'pdf',
      event_label: 'portfolio-pdf',
      transport_type: 'beacon',
      event_callback: go
    });
    setTimeout(go, 500); // never leave the reader waiting on analytics
  })();
</script>
