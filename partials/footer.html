<footer>
  <!-- The back-to-top button is the ONLY consumer of this symbol, so the symbol travels
       with it. It used to live in a page-level sprite that 17 shipped pages did not have,
       so on those pages <use href="#i-chevron-up"> resolved to nothing: the SVG reserved
       its 14x14 box and painted a 0x0 bounding box. A broken sprite reference passes every
       text, colour and asset gate, because there is no <img> and no request to fail. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol></svg>

  <div class="footer-logo">Arpit Maheshwari · Indore, India</div>
  <span class="fresh">last shipped 2026-08-31 &middot; 298 changes this month</span>
  <button class="dyslexia-toggle" id="dyslexiaToggle" aria-pressed="false" aria-label="Toggle dyslexia-friendly font" title="Switch to dyslexia-friendly reading mode">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    <span>Dyslexia-friendly</span>
  </button>
  <div class="footer-note">{{FOOTER_NOTE}}</div>
  <button class="footer-back" onclick="window.scrollTo({top:0,behavior:window.matchMedia&amp;&amp;window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})" aria-label="Back to top"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-up"/></svg> Back to top</button>
  <script defer src="{{ROOT}}dyslexia.js"></script>
  <script defer src="{{ROOT}}nav-inert.js"></script>
</footer>
