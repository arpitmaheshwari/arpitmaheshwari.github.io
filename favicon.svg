<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="AM — Arpit Maheshwari">
  <!-- Favicon, brand v1.4.0 (2026-09-06). Variant chosen: "gold break".
       Same geometry as the wordmark — the AM ligature whose shared stem carries a
       deliberate break (chosen 2026-08-13) — with the ember gradient retired. The
       break now carries the one accent. Drawn SQUARE on purpose: an earlier version
       reused the wordmark's 200x140 viewBox and letterboxed inside the tile, which a
       corner-pixel sample caught. The mark is knocked out of an ink tile so it holds
       at 16px on light AND dark browser chrome; the bare-ink variant vanished on a
       dark tab strip when tested at true size. -->
  <rect width="180" height="180" fill="#1A1A1C"/>
  <g transform="translate(4,18)" stroke="#FAF9F6" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,126 L52,18 L88,118"/>
    <path d="M90,48 L90,22 L124,84 L158,22 L158,126"/>
  </g>
  <g transform="translate(4,18)" stroke="#C8862B" stroke-width="20" fill="none" stroke-linecap="round">
    <path d="M90,126 L90,74"/>
  </g>
</svg>
