<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="AM — Arpit Maheshwari">
  <!-- Favicon build of the half-second mark. Same geometry and the SAME GRADIENT as
       assets/logo-ember.svg — a solid-ember favicon beside a gradient site logo read as two
       different marks (Arpit, 2026-08-17). Only the stroke is heavier, so the ligature
       survives at 16px; the colour no longer differs from the logo it stands for. -->
  <defs>
    <linearGradient id="am-hot" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#FF8A5C"/><stop offset="100%" stop-color="#E86BFF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#am-hot)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,126 L52,18 L88,118"/>
    <path d="M90,126 L90,74"/>
    <path d="M90,48 L90,22 L124,84 L158,22 L158,126"/>
  </g>
</svg>
