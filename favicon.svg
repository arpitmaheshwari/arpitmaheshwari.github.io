<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="AM — Arpit Maheshwari">
  <!-- Favicon, cream guide (2026-09-06). A favicon is SQUARE, so this is drawn square:
       an earlier version reused the wordmark's 200x140 viewBox and letterboxed inside the
       tile, leaving white bands top and bottom (caught by sampling the corner pixel).
       Same geometry as the wordmark — the AM ligature with the deliberate break in the
       shared stem (chosen 2026-08-13) — with the ember gradient retired. The mark is
       knocked out of an ink tile so it survives 16px on BOTH light and dark browser
       chrome; a bare ink mark vanished on a dark tab strip at true size. The break
       carries the one accent. -->
  <rect width="180" height="180" fill="#201d18"/>
  <g transform="translate(4,18)" stroke="#f7f4ee" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,126 L52,18 L88,118"/>
    <path d="M90,48 L90,22 L124,84 L158,22 L158,126"/>
  </g>
  <g transform="translate(4,18)" stroke="#8a5a2b" stroke-width="20" fill="none" stroke-linecap="round">
    <path d="M90,126 L90,74"/>
  </g>
</svg>
