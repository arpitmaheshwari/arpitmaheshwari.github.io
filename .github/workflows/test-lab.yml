name: Lab tests

on:
  push:
    paths:
      - 'lab/**'
      - '.github/workflows/test-lab.yml'
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/test-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run trustlayer.js test suite
        run: node lab/trustlayer.test.js
