name: Contrast gate

# Fails the build on any WCAG AA contrast regression, measured from RENDERED PIXELS.
#
# Why this gate exists: for months, style-based contrast checks reported this site "clean" while the
# primary call-to-action on the book cover sat at 1.18:1 — invisible. Those checks read
# `backgroundColor` and walked up the DOM, so a surface painted with a background-IMAGE (the cover's
# gradient) fell through to an unrelated ancestor and got compared against the wrong colour. The
# defect was only found by a human opening the page. This gate closes that loop mechanically.
#
# tools/contrast-audit.py plants a deliberately failing element and refuses to report anything until
# it has confirmed it catches it, so a silently-broken checker fails the build instead of passing it.

on:
  push:
    paths: ['**.html', '**.css', '**.js', '.github/workflows/contrast-gate.yml', 'tools/contrast-audit.py']
  pull_request:
    paths: ['**.html', '**.css', '**.js', '.github/workflows/contrast-gate.yml', 'tools/contrast-audit.py']
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet --upgrade pillow

      - name: Locate Chrome
        run: |
          for c in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on the runner. Add browser-actions/setup-chrome@v1."
          exit 1

      - name: Serve the site
        run: |
          python3 -m http.server 8000 --directory . &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8000/ && break
            sleep 0.25
          done
          curl -sf -o /dev/null http://localhost:8000/ || { echo "::error::server never came up"; exit 1; }

      # Fonts come from Google Fonts over the network. If the runner cannot reach them, layout shifts
      # and sampled rects move — so fail loudly here rather than produce a misleading green.
      - name: Check webfonts are reachable
        run: |
          curl -sf -o /dev/null "https://fonts.googleapis.com/css2?family=Newsreader&display=swap" \
            || { echo "::error::Google Fonts unreachable — results would not be trustworthy"; exit 1; }

      # The page set is deliberately not "every page": each URL costs three headless renders per
      # width. These cover every distinct colour context on the site — dark theme, cream acts, the
      # gradient book cover, the semantic status palette, and the mockup plates. Add a URL here when
      # a new colour context is introduced, not when a new page is.
      #
      # 2026-08-02 — this list was GREEN while five case pages carried 18 AA failures between them.
      # The policy above was right; the enumeration was wrong. adtech.html was standing in for "a
      # case study", but a case study is not one colour context — each recon/plate carries its own
      # palette, and adtech happens to use none of the three that were broken. Added below, each
      # for the context it uniquely contributes (NOT because it is another case page):
      #   o2       .plM  — a WHITE phone mockup embedded in a dark page, plus a copper app bar
      #                    whose inherited text colour was never re-stated (3.35:1)
      #   orgos    .plO  — a pale-teal board surface; its own light palette, unrelated to .plM
      # Both verified 0 failures at BOTH widths before being added here.
      #
      # 2026-08-02 (later the same day) — vc-diligence.html is now IN the list. It was held out
      # because its .plV plate laid out ~450px wide inside a 390px viewport and was clipped
      # mid-word, which the audit reported as nine contrast failures sampled off the clipped edge.
      # That was correctly read as a symptom: the nine "colours" were never broken. Root cause was
      # a grid blowout — `grid-template-columns:1fr` cannot shrink a track below its item's
      # min-content, and the nowrap source chips put that at ~450px, so .plV's overflow:hidden ate
      # the difference. Fixed with minmax(0,1fr) plus letting the signal rows stack under 700px.
      # The nine readings disappeared with the layout, exactly as predicted; desktop is unchanged
      # (verified by a zero-pixel image diff of the full page at 1440 before vs after).
      #   vc-diligence  .plV / .rxv  — semantic status tokens as TEXT on a dark card
      # Verified 0 failures at BOTH widths before being added here.
      #
      # 2026-08-02 — fintech.html is now IN the list, and the note that used to sit here was wrong.
      # It claimed fintech still measured 3.32:1 on 'Medium confidence'. That reading was taken from
      # a working tree one commit behind master: 3629aa2 had already repointed .rxf-conf to --warn.
      # Re-measured on the merged tree, that element is 12.31:1. Correcting rather than deleting,
      # because the lesson is the reusable part — measure the tree you are actually shipping.
      #
      # The same check did find two REAL failures on fintech that this gate structurally cannot see,
      # both --copper (#4A6B5C, 3.35:1) and both reachable only through an interaction:
      #   .rxf-unsure  "I'm not sure about this one"     — only inside the opened Explain drawer
      #   .rxf-logged  "Disagreement logged"             — display:none until Log override is clicked
      # Repointed to --warn (12.31:1) and --ok (10.64:1), verified by driving the real controls and
      # measuring the revealed state by hand. The audit's own summary line says it: state not
      # reachable on load is NOT measured. So fintech's green here covers its load state only.
      #   fintech  .rxf  — semantic status tokens as TEXT on a dark card
      # Verified 0 failures at BOTH widths before being added here.
      #
      # STILL UNCOVERED, stated rather than hidden: every interaction-only style on every page in
      # this list — open drawers, expanded panels, hover and focus states. Two of the three defects
      # found on fintech lived exactly there, so this is not a hypothetical gap. A green run means
      # "clean as first painted", never "clean".
      - name: Contrast audit (pixel-truth, self-calibrating)
        run: |
          python3 tools/contrast-audit.py \
            --docroot . \
            --widths 1440,390 \
            --exempt '.bk-device__label, .bk-device__mark' \
            --force-visible '.reveal' \
            http://localhost:8000/ \
            http://localhost:8000/book/ \
            http://localhost:8000/hire/ \
            http://localhost:8000/lab/eval.html \
            http://localhost:8000/patterns/capability-contract.html \
            http://localhost:8000/case-studies/adtech.html \
            http://localhost:8000/case-studies/o2.html \
            http://localhost:8000/case-studies/orgos.html \
            http://localhost:8000/case-studies/vc-diligence.html \
            http://localhost:8000/case-studies/fintech.html \
            http://localhost:8000/404.html

      - name: Fail if a stray wrapper file was left behind
        if: always()
        run: |
          if ls __ca_*.html >/dev/null 2>&1; then
            echo "::error::contrast-audit left wrapper files behind — its cleanup path is broken"
            exit 1
          fi
