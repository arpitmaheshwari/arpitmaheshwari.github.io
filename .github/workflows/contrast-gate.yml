name: Contrast gate

# Fails the build on any WCAG AA contrast regression, measured from RENDERED PIXELS.
#
# Why this gate exists: for months, style-based contrast checks reported this site "clean" while the
# primary call-to-action on the book cover sat at 1.18:1 — invisible. Those checks read
# `backgroundColor` and walked up the DOM, so a surface painted with a background-IMAGE (the cover's
# gradient) fell through to an unrelated ancestor and got compared against the wrong colour. The
# defect was only found by a human opening the page. This gate closes that loop mechanically.
#
# tools/contrast-audit.py plants a deliberately failing element and refuses to report anything until
# it has confirmed it catches it, so a silently-broken checker fails the build instead of passing it.

on:
  push:
    paths: ['**.html', '**.css', '**.js', '**.svg', '.github/workflows/contrast-gate.yml', 'tools/contrast-audit.py', 'tools/asset-load-check.py', 'tools/generate-og-cards.py', 'assets/og-images/_card.template.html']
  pull_request:
    paths: ['**.html', '**.css', '**.js', '**.svg', '.github/workflows/contrast-gate.yml', 'tools/contrast-audit.py', 'tools/asset-load-check.py', 'tools/generate-og-cards.py', 'assets/og-images/_card.template.html']
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet --upgrade pillow

      # ubuntu-latest does not reliably ship Chrome/Chromium — this step's own error message used
      # to just NAME the fix ("Add browser-actions/setup-chrome@v1") without applying it, so every
      # run failed here. setup-chrome doesn't put a fixed binary name on PATH (its README: the name
      # varies by OS/version), so consume its `chrome-path` output rather than guessing a command.
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Locate Chrome
        run: |
          for c in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          path="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "$path" ] && [ -x "$path" ]; then
            echo "CHROME=$path" >> "$GITHUB_ENV"
            "$path" --version
            exit 0
          fi
          echo "::error::No Chrome/Chromium found on PATH, and browser-actions/setup-chrome produced no usable chrome-path ('$path')."
          exit 1

      - name: Serve the site
        run: |
          python3 -m http.server 8000 --directory . &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8000/ && break
            sleep 0.25
          done
          curl -sf -o /dev/null http://localhost:8000/ || { echo "::error::server never came up"; exit 1; }

      # Fonts come from Google Fonts over the network. If the runner cannot reach them, layout shifts
      # and sampled rects move — so fail loudly here rather than produce a misleading green.
      - name: Check webfonts are reachable
        run: |
          curl -sf -o /dev/null "https://fonts.googleapis.com/css2?family=Newsreader&display=swap" \
            || { echo "::error::Google Fonts unreachable — results would not be trustworthy"; exit 1; }

      # The page set is deliberately not "every page": each URL costs three headless renders per
      # width. These cover every distinct colour context on the site — dark theme, cream acts, the
      # gradient book cover, the semantic status palette, and the mockup plates. Add a URL here when
      # a new colour context is introduced, not when a new page is.
      #
      # 2026-08-02 — this list was GREEN while five case pages carried 18 AA failures between them.
      # The policy above was right; the enumeration was wrong. adtech.html was standing in for "a
      # case study", but a case study is not one colour context — each recon/plate carries its own
      # palette, and adtech happens to use none of the three that were broken. Added below, each
      # for the context it uniquely contributes (NOT because it is another case page):
      #   o2       .plM  — a WHITE phone mockup embedded in a dark page, plus a copper app bar
      #                    whose inherited text colour was never re-stated (3.35:1)
      #   orgos    .plO  — a pale-teal board surface; its own light palette, unrelated to .plM
      # Both verified 0 failures at BOTH widths before being added here.
      #
      # DELIBERATELY STILL ABSENT — case-studies/vc-diligence.html. It carries a context nothing
      # else covers (semantic status tokens as TEXT on a dark card) and SHOULD be here, but it
      # cannot be added yet: at 390px its .plV diligence-dossier plate lays out ~450px wide inside
      # a 390px viewport and is visibly clipped mid-word ("repo scan ·", "commit history · releas…").
      # The audit reports that as nine contrast failures because it samples the clipped edge pixels
      # — the reading is a symptom, the layout is the bug. Adding the URL now would just pin CI red
      # against a defect this gate is not the right tool to describe. Fix the responsive layout,
      # then add the URL. Tracked separately; do not "fix" those nine colours, they are not broken.
      # Residual risk, stated rather than hidden: fintech's .rxf-conf shares vc's colour context,
      # so that context is currently UNCOVERED in CI until vc-diligence can be added.
      # Added 2026-08-02. The /process method diagram had been a BROKEN IMAGE on the live site:
      # a literal angle-bracket tag inside a CSS comment made the SVG invalid XML, and an SVG
      # loaded through an img element must be valid XML or the browser refuses to paint it.
      # naturalWidth was 0. Every gate here checked text, agreement or colour; none asked whether
      # the picture loaded at all. Unlike the contrast list below, this one SHOULD enumerate every
      # page — the check is cheap and a broken asset is page-specific, not context-specific.
      - name: Asset load check (SVG validity + every image actually paints)
        run: |
          python3 tools/asset-load-check.py --docroot . --all
      - name: Fail if asset-load-check left a wrapper behind
        if: always()
        run: |
          if ls __al_*.html >/dev/null 2>&1 || ls __al_canary_*.svg >/dev/null 2>&1; then
            echo "::error::asset-load-check left temp files behind — its cleanup path is broken"
            exit 1
          fi

      # 2026-08-10: an OG-card audit found 4 blank/broken cards, 4 pages with NO card at all
      # (silently falling back to a personal photo as their share image), and 1 page reusing a
      # different page's card — invisible to every text gate because the defect was baked into
      # PNG pixels. This only checks presence/size (a pixel diff would false-positive on font
      # rendering nondeterminism across runners) — it exists to catch a card going MISSING or
      # reverting to a stub again, not to lint pixel content.
      - name: OG card presence check (registry vs disk)
        run: |
          python3 tools/generate-og-cards.py --check

      # Every shipped page, discovered from git — NOT a hand-typed list. On 2026-08-07 the
      # list below named 9 pages, so 11 shipped pages had never been contrast-checked at all
      # (lab/loop.html, lab/teardown.html, all 4 writing/ posts, all 3 resources/ pages).
      # They passed when finally run, but a scope that has to be remembered stops covering
      # whatever is added next. --all cannot fall behind the site.
      - name: Contrast audit — every shipped page (pixel-truth, self-calibrating)
        run: |
          python3 tools/contrast-audit.py \
            --docroot . \
            --widths 1440,390 \
            --exempt '.bk-device__label, .bk-device__mark' \
            --force-visible '.reveal' \
            --all

      - name: Fail if a stray wrapper file was left behind
        if: always()
        run: |
          if ls __ca_*.html >/dev/null 2>&1; then
            echo "::error::contrast-audit left wrapper files behind — its cleanup path is broken"
            exit 1
          fi
