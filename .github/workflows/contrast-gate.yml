name: Contrast gate

# Fails the build on any WCAG AA contrast regression, measured from RENDERED PIXELS.
#
# Why this gate exists: for months, style-based contrast checks reported this site "clean" while the
# primary call-to-action on the book cover sat at 1.18:1 — invisible. Those checks read
# `backgroundColor` and walked up the DOM, so a surface painted with a background-IMAGE (the cover's
# gradient) fell through to an unrelated ancestor and got compared against the wrong colour. The
# defect was only found by a human opening the page. This gate closes that loop mechanically.
#
# tools/contrast-audit.py plants a deliberately failing element and refuses to report anything until
# it has confirmed it catches it, so a silently-broken checker fails the build instead of passing it.

# PATHS: 'tools/**', not an enumerated list of three scripts. The filter used to name
# contrast-audit.py, asset-load-check.py and generate-og-cards.py — while the same job also
# runs overflow-sweep, cta-grammar-check and theme-remnant-check, and ALL of them import
# tools/cdp.py. So commit 034652c2, which fixed the hardcoded macOS Chrome path in cdp.py
# and ten other tools, changed nothing the filter matched and this workflow DID NOT RUN.
# A gate that its own engine's repairs cannot trigger is a gate you cannot fix on purpose.
on:
  push:
    paths: ['**.html', '**.css', '**.js', '**.svg', '.github/workflows/contrast-gate.yml', 'tools/**', 'assets/og-images/_card.template.html']
  pull_request:
    paths: ['**.html', '**.css', '**.js', '**.svg', '.github/workflows/contrast-gate.yml', 'tools/**', 'assets/og-images/_card.template.html']
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # websocket-client is NOT optional: tools/cdp.py imports websocket, and every gate
      # that drives Chrome imports cdp. On 2026-08-30 asset-load-check started importing
      # cdp and this step still installed only Pillow, so the gate died at IMPORT time on
      # every push for five days — "ModuleNotFoundError: No module named 'websocket'".
      # It looked like a failing check; it was a check that never ran.
      # tools/ci-deps-check.py keeps this list honest against what tools/ actually imports.
      - name: Install Python dependencies (pillow, websocket-client)
        run: python -m pip install --quiet --upgrade pillow websocket-client

      # ubuntu-latest does not reliably ship Chrome/Chromium — this step's own error message used
      # to just NAME the fix ("Add browser-actions/setup-chrome@v1") without applying it, so every
      # run failed here. setup-chrome doesn't put a fixed binary name on PATH (its README: the name
      # varies by OS/version), so consume its `chrome-path` output rather than guessing a command.
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Locate Chrome
        run: |
          for c in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          path="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "$path" ] && [ -x "$path" ]; then
            echo "CHROME=$path" >> "$GITHUB_ENV"
            "$path" --version
            exit 0
          fi
          echo "::error::No Chrome/Chromium found on PATH, and browser-actions/setup-chrome produced no usable chrome-path ('$path')."
          exit 1

      - name: Serve the site
        run: |
          python3 -m http.server 8000 --directory . &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8000/ && break
            sleep 0.25
          done
          curl -sf -o /dev/null http://localhost:8000/ || { echo "::error::server never came up"; exit 1; }

      # Fonts come from Google Fonts over the network. If the runner cannot reach them, layout shifts
      # and sampled rects move — so fail loudly here rather than produce a misleading green.
      # ONE LIST. Every gate this job runs, and the arguments it runs with, come from
      # tools/gates.json — the same file .githooks/pre-push reads. These used to be two
      # hand-maintained lists that nothing required to agree, and they stopped agreeing:
      # the hook ran asset-load-check against two URLs while this workflow ran --all, so a
      # green hook said nothing about the gate that was failing. The Contrast gate was red
      # on thirty consecutive pushes before anyone noticed.
      # run-gates emits each failure as a ::error:: annotation, because job logs need admin
      # rights to read and an unreadable failure is how the last one hid for five days.
      - name: Gates (from tools/gates.json)
        run: python3 tools/run-gates.py --stage ci --parallel 4

      - name: Fail if a stray wrapper file was left behind
        if: always()
        run: |
          if ls __ca_*.html >/dev/null 2>&1; then
            echo "::error::contrast-audit left wrapper files behind — its cleanup path is broken"
            exit 1
          fi
