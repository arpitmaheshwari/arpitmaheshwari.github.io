# The multi-minute browser sweeps, off the push path.
#
# WHY THIS EXISTS. On 2026-09-04 the contrast-gate job grew to 34 gates and took 28
# minutes. That is not a gate, it is a queue: a 28-minute feedback loop is one people
# learn to ignore, and being ignored is exactly how the Contrast gate stayed red for
# thirty consecutive pushes without anyone noticing.
#
# So the split is by COST, not by importance. Every push still gets the fast suite
# (contrast-gate.yml, ~23 gates). The ten sweeps here re-render every page at several
# widths and cost minutes each; they run once a night and on demand.
#
# The one that deserves a note is contrast-audit. It is the flagship gate and it is here
# rather than on every push because it alone is ~10 minutes. It is NOT unguarded in the
# meantime: .githooks/pre-push runs it locally before every push, so a contrast
# regression is caught before the code leaves the machine. This job is the backstop for
# the case the hook was skipped.
#
# The gate list is tools/gates.json, the same file the hook and the other two workflows
# read. Nothing is enumerated here.
name: Nightly sweep

on:
  # TEMPORARY, 2026-09-04. This workflow has never run: twelve gates whose CI behaviour is
  # entirely unverified, and I have now been wrong twice about a gate working in CI because
  # it worked locally. Waiting for 02:00 to find out is not a plan. This trigger fires the
  # sweep when the workflow file itself changes, so it can be exercised on demand without a
  # token. REMOVE once the first run is green.
  push:
    paths: ['.github/workflows/nightly-sweep.yml']
  schedule:
    # 02:00 UTC = 07:30 in Indore, so a failure is waiting at the start of the day
    # rather than discovered at the end of one.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # websocket-client is NOT optional: tools/cdp.py imports websocket, and every gate
      # in this job drives Chrome through cdp. Omitting it once already cost five days of
      # a gate that died at import and looked like a gate that was failing.
      - name: Install Python dependencies (pillow, websocket-client)
        run: python -m pip install --quiet --upgrade pillow websocket-client

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Locate Chrome
        run: |
          for c in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          path="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "$path" ] && [ -x "$path" ]; then
            echo "CHROME=$path" >> "$GITHUB_ENV"
            "$path" --version
            exit 0
          fi
          echo "::error::No Chrome/Chromium found on PATH, and browser-actions/setup-chrome produced no usable chrome-path ('$path')."
          exit 1

      # run-gates starts its own server, but these gates hard-code :8000 between them, so
      # it is started here once and reused — same arrangement as contrast-gate.yml.
      - name: Serve the site
        run: |
          python3 -m http.server 8000 --directory . &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8000/ && break
            sleep 0.25
          done
          curl -sf -o /dev/null http://localhost:8000/ || { echo "::error::server never came up"; exit 1; }

      # TEMPORARY, 2026-09-05. The ten homepage contrast "failures" this job reports are
      # false: every authored pair measures 6.4:1 to 10.7:1 from the stylesheet, and every
      # ratio reported here is roughly half that. Two fixes did not clear it and a third was
      # reverted for blinding 30 elements. Standing hypothesis: the audit's settle step races
      # document.fonts.ready against a 4000ms deadline, and a cold runner that loses it
      # captures the page in FALLBACK faces — different glyph coverage, so the un-blend that
      # recovers ink from coverage returns a colour nobody authored.
      #
      # Runs BEFORE the sweep, so it reports the same cold-cache state the sweep will see.
      # Non-blocking: a diagnosis must never be able to redden a build. REMOVE once answered.
      - name: Diagnose — font state on the runner
        continue-on-error: true
        run: python3 tools/runner-diagnose.py process/

      # THE ALPHA PROBE. Fonts are ruled out (54ms, real faces, authored colours), so what
      # is left is the recovery arithmetic. Locally this prints alpha=1.000 on the covered
      # pixels, A equal to the authored colour, and ratio 7.24 — the true value. If the
      # runner prints a lower alpha, or an A that is not the authored colour, that is the
      # answer. Two elements: the worst reported (2.40:1) and the CTA on its gradient pill.
      - name: Diagnose — alpha recovery on the runner
        continue-on-error: true
        run: |
          python3 tools/alpha-probe.py "What the two weeks held" || true
          python3 tools/alpha-probe.py "Send me the role" || true

      # Re-fired 2026-09-05 (fourth time) with the pixel-SELECTION step rewritten. The
      # camera calibration came back green, which exonerated frame geometry and left
      # exactly one suspect: the audit chose the 10th-percentile WORST ratio among every
      # pixel above 0.85 of peak coverage, i.e. its own noisiest un-blend. Ink recovery is
      # now restricted to the glyph core. A fourth canary — 11px semibold, the size class
      # that broke — guards the false PASS this narrowing could otherwise introduce.
      # Old comment kept below; it still names the three outcomes worth watching for.
      # Re-fired 2026-09-05 (third time) to read the ten homepage contrast reports
      # through the new CAMERA CALIBRATION. The audit now refuses to grade unless the
      # captured frame is the same size as the emulated viewport, and reports a
      # scrollTo that does not scroll. Three outcomes, all of them informative:
      #   * a refusal naming the frame size -> the camera was the defect, as suspected
      #   * the ten clear                   -> it was, and the assertion also fixed it
      #   * the ten persist, calibration green -> the camera is EXONERATED, and the
      #     next suspect is which rect the audit believes each element occupies
      - name: Sweeps (from tools/gates.json)
        # Re-fired 2026-09-05 to verify the two contrast fixes on Linux: the
        # ALPHA_FLOOR guard against noisy un-blends, and sr-only recognition. Both
        # landed AFTER the last nightly run, so the ten reported failures have not
        # been re-taken since. Unproven on the runner is not fixed.
        # --parallel 3 was set before the shared-file race in the calibrations was
        # understood. gatelib.planted() now locks plant -> scan -> restore, so
        # concurrency is safe again; the first run of this workflow reported ten
        # homepage contrast failures and predates that fix, so its verdict is being
        # re-taken rather than acted on.
        run: python3 tools/run-gates.py --stage nightly --parallel 3

      - name: Fail if a gate left a wrapper file behind
        if: always()
        run: |
          if ls __al_*.html >/dev/null 2>&1 || ls __al_canary_*.svg >/dev/null 2>&1; then
            echo "::error::a gate left temp files behind — its cleanup path is broken"
            exit 1
          fi
