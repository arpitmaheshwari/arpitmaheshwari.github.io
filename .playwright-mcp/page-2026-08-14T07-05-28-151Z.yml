          - paragraph [ref=f48e153]: The contract I write when a capability needs a boundary
          - heading "A language model has no edges. So I draw them." [level=2] [ref=f48e154]
          - paragraph [ref=f48e155]: Ask one anything and it answers — fluently, in or out of its depth. A user's trust does not erode slowly; it dies in a single confident wrong answer. So before launch I write a capability contract — a one-pager the whole team signs — and it goes in the interface, at the point of use.
          - generic [ref=f48e156]:
            - generic [ref=f48e157]:
              - paragraph [ref=f48e158]: In scope
              - heading "It's for" [level=3] [ref=f48e159]
              - paragraph [ref=f48e160]: The job stated narrowly — “score deal risk from the data room,” not “analyse documents.”
            - generic [ref=f48e161]:
              - paragraph [ref=f48e162]: Declines
              - heading "It can't" [level=3] [ref=f48e163]
              - paragraph [ref=f48e164]: A named limit, not a hedge. “I can't price illiquid assets” — never “results may vary.”
