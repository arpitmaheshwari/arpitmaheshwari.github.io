<svg id="art-calibration-narrow" class="art-narrow" viewBox="-16 -16 392 583" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-calibration-narrow-t art-calibration-narrow-d">
<title id="art-calibration-narrow-t">Calibration &amp; Track Record pattern</title>
<desc id="art-calibration-narrow-d">A stated confidence of 94 per cent, then the receipts: a reliability line comparing predicted against actual, and a breakdown by case type showing 96, 91 and 72 per cent.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="583" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Calibration &amp; Track Record</text>
<text class="n-sub" x="0" y="43">Is the confidence actually right?</text>
<text class="n-sub" x="0" y="62">Show the receipts.</text>
<rect class="n-card" x="0" y="84" width="360" height="74" rx="6"/>
<text class="n-act" x="16" y="110">Confidence</text>
<text class="n-num" x="16" y="142">94%</text>
<text class="n-cap" x="76" y="142">High</text>
<text class="n-act" x="0" y="206">Reliability</text>
<text class="n-cap" x="0" y="224">stated confidence</text>
<path class="n-rule" d="M40 238 L40 358 L340 358"/>
<path class="n-dash" d="M40 358 L340 238"/>
<path class="n-edge" d="M40 358 C 140 312, 240 274, 340 246"/>
<text class="n-cap" x="46" y="250">perfect</text>
<text class="n-cap" x="232" y="302">observed</text>
<text class="n-cap" x="0" y="376">predicted</text>
<text class="n-cap" x="286" y="376">actual</text>
<text class="n-quo" x="0" y="408">Tracks the line: confidence</text>
<text class="n-quo" x="0" y="427">earns its trust.</text>
<text class="n-act" x="0" y="461">By case type</text>
<text class="n-cap" x="0" y="487">Type A</text>
<rect class="n-band" x="72" y="476" width="216" height="14" rx="3"/>
<text class="n-cap" x="296" y="487">96%</text>
<text class="n-cap" x="0" y="513">Type B</text>
<rect class="n-band" x="72" y="502" width="201" height="14" rx="3"/>
<text class="n-cap" x="281" y="513">91%</text>
<text class="n-cap" x="0" y="539">Type C</text>
<rect class="n-band" x="72" y="528" width="144" height="14" rx="3"/>
<text class="n-cap" x="224" y="539">72%</text>
</svg>
