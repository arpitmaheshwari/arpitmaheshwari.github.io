<svg id="art-failure-narrow" class="art-narrow" viewBox="-16 -16 392 513" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-failure-narrow-t art-failure-narrow-d">
<title id="art-failure-narrow-t">Failure States pattern</title>
<desc id="art-failure-narrow-d">The wrong-answer screen, designed first. Against a question the model is not confident enough to answer, it says so plainly, reports low confidence, and offers two ways forward: try another source, or ask a human.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="513" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Failure States</text>
<text class="n-sub" x="0" y="43">Design the wrong-answer</text>
<text class="n-sub" x="0" y="62">screen first.</text>
<rect class="n-card" x="0" y="84" width="360" height="150" rx="6"/>
<text class="n-act" x="16" y="108">Not confident enough</text>
<text class="n-cap" x="16" y="130">Your question</text>
<rect class="n-band" x="16" y="140" width="300" height="16" rx="3"/>
<text class="n-mv" x="16" y="174">I’m not sure</text>
<text class="n-mv" x="16" y="198">about this one.</text>
<text class="n-cap" x="16" y="224">Confidence</text>
<text class="n-act" x="100" y="224">Low</text>
<text class="n-act" x="0" y="282">What now?</text>
<rect class="n-card" x="0" y="292" width="360" height="48" rx="6"/>
<text class="n-qn" x="16" y="316">Try another source</text>
<text class="n-cap" x="16" y="334">Search a different reference</text>
<rect class="n-card" x="0" y="360" width="360" height="48" rx="6"/>
<text class="n-qn" x="16" y="384">Ask a human</text>
<text class="n-cap" x="16" y="402">Route to a person who knows</text>
<text class="n-quo" x="0" y="450">A graceful unknown beats a</text>
<text class="n-quo" x="0" y="469">confident wrong answer.</text>
</svg>
