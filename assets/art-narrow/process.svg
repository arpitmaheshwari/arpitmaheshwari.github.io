<svg id="art-index-narrow" class="art-narrow" viewBox="-16 -16 392 708" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-index-narrow-t art-index-narrow-d">
<title id="art-index-narrow-t">The method: every turn narrows the bet</title>
<desc id="art-index-narrow-d">Read top to bottom. Three questions — desirable, feasible, viable — converge into one bet worth making. The bet passes through four repeating stages: listen, structure, prove, land. The band beside them narrows at every stage. It ends at ship, where the loop does not close.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="708" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Every turn narrows the bet.</text>
<text class="n-sub" x="0" y="43">The gap = how big a bet someone else</text>
<text class="n-sub" x="0" y="62">still has to accept</text>
<text class="n-act" x="0" y="96">Act I · the wager</text>
<text class="n-qn" x="0" y="123">Desirable?</text>
<text class="n-qn" x="0" y="147">Feasible?</text>
<text class="n-qn" x="0" y="171">Viable?</text>
<path class="n-edge" d="M104 118 L168 144"/>
<path class="n-edge" d="M96 144 L168 144"/>
<path class="n-edge" d="M82 166 L168 144"/>
<circle class="n-node" cx="172" cy="144" r="4.5"/>
<text class="n-cap" x="0" y="193">All three, or it dies in review</text>
<text class="n-act" x="0" y="227">Act II · the spiral</text>
<text class="n-cap" x="0" y="247">= one turn: listen, structure,</text>
<text class="n-cap" x="0" y="264">prove, land</text>
<path class="n-band" d="M246 284 L356 284 L330 476 L272 476 Z"/>
<path class="n-edge" d="M259 284 L259 474"/>
<circle class="n-node" cx="259" cy="300" r="4.5"/>
<text class="n-mv" x="0" y="306">Listen</text>
<circle class="n-node" cx="259" cy="358" r="4.5"/>
<text class="n-mv" x="0" y="364">Structure</text>
<circle class="n-node" cx="259" cy="416" r="4.5"/>
<text class="n-mv" x="0" y="422">Prove</text>
<circle class="n-node" cx="259" cy="474" r="4.5"/>
<text class="n-mv" x="0" y="480">Land</text>
<text class="n-cap" x="0" y="506">Research is a rhythm,</text>
<text class="n-cap" x="0" y="522">not a phase</text>
<path class="n-dash" d="M259 474 L259 574"/>
<circle class="n-node" cx="259" cy="574" r="4.5"/>
<text class="n-act" x="0" y="552">Act III · the open loop</text>
<text class="n-mv" x="0" y="578">Ship</text>
<text class="n-quo" x="0" y="606">Confidence is earned in loops,</text>
<text class="n-quo" x="0" y="625">not declared in launches.</text>
<text class="n-cap" x="0" y="647">Shipping is the first honest data ·</text>
<text class="n-cap" x="0" y="664">the turns do not stop</text>
</svg>
