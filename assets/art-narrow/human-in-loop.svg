<svg id="art-human-loop-narrow" class="art-narrow" viewBox="-16 -16 392 427" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-human-loop-narrow-t art-human-loop-narrow-d">
<title id="art-human-loop-narrow-t">Human-in-the-Loop pattern</title>
<desc id="art-human-loop-narrow-d">Three steps down the page: the model suggests, the human overrides and edits, and the next result is improved. The correction becomes the next training signal, and the three steps close into a loop.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="427" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Human-in-the-Loop</text>
<text class="n-sub" x="0" y="43">Override should feel like authorship —</text>
<text class="n-sub" x="0" y="62">corrections become the next</text>
<text class="n-sub" x="0" y="81">training signal.</text>
<rect class="n-card" x="0" y="97" width="360" height="56" rx="6"/>
<text class="n-act" x="16" y="119">01 · model</text>
<text class="n-qn" x="16" y="141">Suggests</text>
<rect class="n-card" x="0" y="169" width="360" height="56" rx="6"/>
<text class="n-act" x="16" y="191">02 · human</text>
<text class="n-qn" x="16" y="213">Overrides &amp; edits</text>
<rect class="n-card" x="0" y="241" width="360" height="56" rx="6"/>
<text class="n-act" x="16" y="263">03 · next result</text>
<text class="n-qn" x="16" y="285">Improved</text>
<path class="n-edge" d="M24 153 L24 169"/>
<path class="n-edge" d="M20 162 L24 169 L28 162"/>
<path class="n-edge" d="M24 225 L24 241"/>
<path class="n-edge" d="M20 234 L24 241 L28 234"/>
<text class="n-cap" x="0" y="323">correction → next training signal</text>
<text class="n-act" x="0" y="357">The loop</text>
<text class="n-quo" x="0" y="383">Suggest → Override → Re-learn</text>
</svg>
