<svg id="art-ml-explain-narrow" class="art-narrow" viewBox="-16 -16 392 709" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-ml-explain-narrow-t art-ml-explain-narrow-d">
<title id="art-ml-explain-narrow-t">Explainability pattern</title>
<desc id="art-ml-explain-narrow-d">Three named drivers carry weights — payment history plus 0.42, account age plus 0.27, recent inquiries minus 0.15 — and an explanation drawer traces them back from a risk score of 724. Disagreeing is offered as an action.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="709" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Explainability</text>
<text class="n-sub" x="0" y="43">Turn a black-box output into</text>
<text class="n-sub" x="0" y="62">an auditable argument.</text>
<text class="n-act" x="0" y="94">Drivers</text>
<rect class="n-card" x="0" y="104" width="360" height="54" rx="6"/>
<text class="n-qn" x="16" y="130">Payment history</text>
<text class="n-cap" x="16" y="147">weight +0.42</text>
<rect class="n-card" x="0" y="169" width="360" height="54" rx="6"/>
<text class="n-qn" x="16" y="195">Account age</text>
<text class="n-cap" x="16" y="212">weight +0.27</text>
<rect class="n-card" x="0" y="234" width="360" height="54" rx="6"/>
<text class="n-qn" x="16" y="260">Recent inquiries</text>
<text class="n-cap" x="16" y="277">weight -0.15</text>
<text class="n-act" x="0" y="325">Why this output</text>
<rect class="n-card" x="0" y="337" width="360" height="96" rx="6"/>
<text class="n-cap" x="16" y="361">Explanation drawer</text>
<text class="n-cap" x="16" y="382">Payment history</text>
<text class="n-cap" x="16" y="403">Account age</text>
<text class="n-cap" x="16" y="424">Recent inquiries</text>
<text class="n-cap" x="0" y="470">traced back from the score</text>
<rect class="n-card" x="0" y="488" width="360" height="72" rx="6"/>
<text class="n-act" x="16" y="512">Output</text>
<text class="n-num" x="16" y="544">724</text>
<text class="n-cap" x="74" y="544">risk score</text>
<rect class="n-card" x="0" y="588" width="360" height="44" rx="6"/>
<text class="n-qn" x="16" y="615">I disagree</text>
<text class="n-cap" x="0" y="665">a first-class action, not a footnote</text>
</svg>
