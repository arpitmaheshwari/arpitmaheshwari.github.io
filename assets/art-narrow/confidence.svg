<svg id="art-confidence-narrow" class="art-narrow" viewBox="-16 -16 392 558" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-confidence-narrow-t art-confidence-narrow-d">
<title id="art-confidence-narrow-t">Confidence Scores pattern</title>
<desc id="art-confidence-narrow-d">A score of 78 out of 100 sits on a scale, and each band of the scale names the action it licenses: act at 75 to 100, review at 40 to 74, ignore at 0 to 39. Beneath it a 30-day track record reports 91 per cent calibration.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="558" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Confidence Scores</text>
<text class="n-sub" x="0" y="43">A number anchored to an action —</text>
<text class="n-sub" x="0" y="62">with its own track record.</text>
<rect class="n-card" x="0" y="84" width="360" height="86" rx="6"/>
<text class="n-act" x="16" y="110">Confidence</text>
<text class="n-num" x="16" y="144">78</text>
<text class="n-cap" x="58" y="144">% confident</text>
<rect class="n-rule" x="16" y="162" width="328" height="8" rx="4"/>
<rect class="n-band" x="16" y="162" width="256" height="8" rx="4"/>
<text class="n-cap" x="16" y="184">0</text>
<text class="n-cap" x="330" y="184">100</text>
<text class="n-act" x="0" y="218">Action</text>
<rect class="n-card" x="0" y="228" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="253">Act</text>
<text class="n-cap" x="140" y="253">75–100</text>
<rect class="n-card" x="0" y="276" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="301">Review</text>
<text class="n-cap" x="140" y="301">40–74</text>
<rect class="n-card" x="0" y="324" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="349">Ignore</text>
<text class="n-cap" x="140" y="349">0–39</text>
<text class="n-act" x="0" y="398">30-day track record</text>
<path class="n-rule" d="M0 468 L340 468"/>
<path class="n-edge" d="M0 456 C 90 442, 200 430, 340 422"/>
<text class="n-cap" x="0" y="486">Day 1</text>
<text class="n-cap" x="286" y="486">Day 30</text>
<text class="n-quo" x="0" y="514">Calibration: 91%</text>
</svg>
