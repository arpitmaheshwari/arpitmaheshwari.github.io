<svg id="art-provenance-narrow" class="art-narrow" viewBox="-16 -16 392 552" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-provenance-narrow-t art-provenance-narrow-d">
<title id="art-provenance-narrow-t">Provenance &amp; Citations pattern</title>
<desc id="art-provenance-narrow-d">A claim — architecture risk 72 — carries three sources: a Q3 filing, an engineering audit, and a founder call that disagrees. Opening one shows the source document and the cited passage inside it.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="552" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">Provenance &amp; Citations</text>
<text class="n-sub" x="0" y="43">Every claim traced to the</text>
<text class="n-sub" x="0" y="62">source behind it.</text>
<text class="n-act" x="0" y="94">Claim</text>
<rect class="n-card" x="0" y="106" width="360" height="76" rx="6"/>
<text class="n-qn" x="16" y="132">Architecture risk:</text>
<text class="n-num" x="16" y="166">72</text>
<text class="n-cap" x="58" y="166">3 sources</text>
<text class="n-act" x="0" y="226">Sources</text>
<rect class="n-card" x="0" y="236" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="261">Q3 filing</text>
<rect class="n-card" x="0" y="284" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="309">Eng. audit</text>
<rect class="n-card" x="0" y="332" width="360" height="38" rx="6"/>
<text class="n-qn" x="16" y="357">Founder call</text>
<text class="n-cap" x="170" y="357">disagrees</text>
<path class="n-dash" d="M24 390 L24 416"/>
<rect class="n-card" x="0" y="422" width="360" height="92" rx="6"/>
<text class="n-act" x="16" y="446">Source doc</text>
<rect class="n-band" x="16" y="458" width="300" height="20" rx="3"/>
<text class="n-cap" x="24" y="472">Cited passage</text>
</svg>
