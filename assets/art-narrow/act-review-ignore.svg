<svg id="art-act-review-narrow" class="art-narrow" viewBox="-16 -16 392 562" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-act-review-narrow-t art-act-review-narrow-d">
<title id="art-act-review-narrow-t">The Act / Review / Ignore rule</title>
<desc id="art-act-review-narrow-d">Three scores, three different screens. A high score of 92 offers act, with its signals named. A mixed score of 61 goes to review, with its reasons on the card. A low score of 23 is ignored — the model declines to bluff.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="562" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">The Act / Review / Ignore Rule</text>
<text class="n-sub" x="0" y="43">One score, one action — a number</text>
<text class="n-sub" x="0" y="62">never reaches the screen alone.</text>
<rect class="n-card" x="0" y="84" width="360" height="102" rx="6"/>
<text class="n-cap" x="16" y="108">Score 92 · high</text>
<text class="n-mv" x="16" y="134">→ Act</text>
<text class="n-cap" x="16" y="154">signals named · safe to run</text>
<text class="n-act" x="16" y="174">Apply</text>
<text class="n-act" x="86" y="174">Override ↶</text>
<rect class="n-card" x="0" y="208" width="360" height="118" rx="6"/>
<text class="n-cap" x="16" y="232">Score 61 · mixed</text>
<text class="n-mv" x="16" y="258">→ Review</text>
<text class="n-cap" x="16" y="278">reasons on the card,</text>
<text class="n-cap" x="16" y="294">not a tooltip:</text>
<text class="n-cap" x="16" y="312">— recency conflict, panels 12 &amp; 14</text>
<text class="n-cap" x="0" y="358">— surfaced for a human · never auto-run</text>
<rect class="n-card" x="0" y="374" width="360" height="60" rx="6"/>
<text class="n-cap" x="16" y="398">Score 23 · low</text>
<text class="n-mv" x="16" y="424">Ignore</text>
<text class="n-quo" x="0" y="480">below the line, the model declines</text>
<text class="n-quo" x="0" y="499">to bluff — the honest no is what</text>
<text class="n-quo" x="0" y="518">makes the act believable.</text>
</svg>
