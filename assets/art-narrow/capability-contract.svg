<svg id="art-capability-narrow" class="art-narrow" viewBox="-16 -16 392 546" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-capability-narrow-t art-capability-narrow-d">
<title id="art-capability-narrow-t">The Capability Contract pattern</title>
<desc id="art-capability-narrow-d">Two columns of a contract stated up front: in scope, scoring standard deals and pricing liquid assets, handled end to end. Out of scope, illiquid assets and novel structures, handed to a human and routed to a specialist.</desc>
<style>
 .n-ttl{font:400 23px Georgia,serif;fill:#F2EDE4}
 .n-sub{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-cap{font:400 15px ui-monospace,monospace;fill:#938B81}
 .n-act{font:400 16px ui-monospace,monospace;fill:#D4A85E}
 .n-qn{font:400 17px Georgia,serif;fill:#F2EDE4}
 .n-mv{font:400 19px Georgia,serif;fill:#F2EDE4}
 .n-num{font:400 26px Georgia,serif;fill:#D4A85E}
 .n-quo{font:italic 400 16px Georgia,serif;fill:#D4A85E}
 .n-edge{fill:none;stroke:#D4A85E;stroke-width:1.25}
 .n-dash{fill:none;stroke:#D4A85E;stroke-width:1.25;stroke-dasharray:4 5}
 .n-rule{fill:none;stroke:#5C554A;stroke-width:1}
 /* Composited, not translucent. fill-opacity leaves the DECLARED fill amber, and
    artifact-legibility-check judges each label against the nearest painted fill —
    so amber text on an amber card measured 1:1 and it reported 67 invisible labels.
    The gate was right to refuse: a checker should not have to guess what alpha
    composites to. These are the same colours, stated. */
 .n-card{fill:#181510;stroke:#8A6E3E;stroke-width:1}
 .n-band{fill:#1E1A12;stroke:#D4A85E;stroke-width:1}
 .n-node{fill:#0A0A0A;stroke:#D4A85E;stroke-width:1.5}
</style>
<rect x="-16" y="-16" width="392" height="546" fill="#0A0A0A"/>
<text class="n-ttl" x="0" y="24">The Capability Contract</text>
<text class="n-sub" x="0" y="43">What it does, where it taps out —</text>
<text class="n-sub" x="0" y="62">stated up front.</text>
<text class="n-act" x="0" y="94">In scope</text>
<rect class="n-card" x="0" y="104" width="360" height="36" rx="6"/>
<text class="n-qn" x="16" y="128">Score standard deals</text>
<rect class="n-card" x="0" y="150" width="360" height="36" rx="6"/>
<text class="n-qn" x="16" y="174">Price liquid assets</text>
<text class="n-cap" x="0" y="210">Confident — handled end to end.</text>
<text class="n-act" x="0" y="246">Out of scope</text>
<rect class="n-card" x="0" y="256" width="360" height="36" rx="6"/>
<text class="n-qn" x="16" y="280">Illiquid assets</text>
<rect class="n-card" x="0" y="302" width="360" height="36" rx="6"/>
<text class="n-qn" x="16" y="326">Novel structures</text>
<text class="n-cap" x="0" y="362">hand to a human</text>
<path class="n-dash" d="M24 378 L24 404"/>
<rect class="n-card" x="0" y="410" width="360" height="46" rx="6"/>
<text class="n-act" x="16" y="432">Hand-off</text>
<text class="n-qn" x="16" y="452">Routed to a specialist</text>
<text class="n-quo" x="0" y="502">Re-routed, not abandoned.</text>
</svg>
