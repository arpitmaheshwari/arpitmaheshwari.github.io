<svg xmlns="http://www.w3.org/2000/svg" width="64" height="45" viewBox="0 0 200 140" role="img" aria-label="AM — Arpit Maheshwari">
  <!-- Cream wordmark (2026-09-06). Replaces logo-ember.svg, which carried the retired
       ember gradient and was being coerced into cream by a CSS filter chain
       (grayscale + brightness + sepia) on an <img> — a hack that made the real asset and
       the rendered mark two different things. The ink is declared here instead. -->
  <g stroke="#201d18" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,126 L52,18 L88,118"/><path d="M90,48 L90,22 L124,84 L158,22 L158,126"/>
  </g>
  <g stroke="#8a5a2b" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M90,126 L90,74"/>
  </g>
</svg>
