<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Generic OG-card generator (1200x630). Reads kicker/title/subtitle/byline from the URL query
     string so ONE file renders every card — see tools/generate-og-cards.py for the registry and
     the render loop. Do not hand-edit a -og.png again; that is how 4 of these went stale and 4
     more went missing entirely with no one noticing (2026-08-10 audit, see CANONICAL-FACTS.md).

     Rebuild a single card by hand for testing:
       chrome --headless --window-size=1200,630 --virtual-time-budget=4000 \
         --screenshot=out.png \
         "http://localhost:8000/assets/og-images/_card.template.html?kicker=DESIGN+PATTERN&title=Title+Here&subtitle=Subtitle+here&byline=Arpit+Maheshwari+%C2%B7+Essay"

     DAYLIGHT (2026-11-27, Arpit: "Later update all the videos , images and  other media"): the card is a
     page top of the live site. Paper ground, the label on the ink line with the rising sun sitting on it,
     the title in ink, the second line in quiet ink. Colour is never a word (the gold title clause and the
     gold second line are gone). Paints are the site's own (css/site/01-tokens.css, the --day-* block),
     written out here because this file loads no stylesheet. Type is the site's own files, declared below,
     so a card no longer depends on which fonts the rendering machine happens to have installed. -->
<style>
  @font-face{font-family:'Source Serif 4';font-style:normal;font-weight:200 900;src:url('/assets/fonts-web/source-serif-4-normal-300_600.woff2') format('woff2')}
  @font-face{font-family:'Source Serif 4';font-style:italic;font-weight:200 900;src:url('/assets/fonts-web/source-serif-4-italic-300_600.woff2') format('woff2')}
  @font-face{font-family:'Source Sans 3';font-style:normal;font-weight:200 900;src:url('/assets/fonts-web/source-sans-3-normal-400.woff2') format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 800;src:url('/assets/fonts-web/jetbrains-mono-normal-400.woff2') format('woff2')}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    /* paper, with the warmth the sun throws (the page top's own wash) */
    background: radial-gradient(90% 70% at 88% 20%, rgba(255,170,110,.20), rgba(255,170,110,0) 70%), #FFFBF6;
    font-family: 'Source Sans 3', sans-serif; color: #241B2B;
  }
  .pad {
    position: absolute; inset: 0;
    padding: 64px 80px 64px;
    display: flex; flex-direction: column;
  }
  /* THE LABEL LINE: the label sits on a 2px ink line; the sun rises from that line at its right end.
     Same part, same sizes as the site's page top from 961px up (180 x 90, halo rings 14 and 30). */
  .kicker {
    display: flex; align-items: flex-end; gap: 16px;
    border-bottom: 2px solid #241B2B; padding-bottom: 12px; margin-bottom: 40px;
    font-family: 'Source Sans 3', sans-serif; font-size: 17px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: #51475A;
  }
  .kicker::after {
    content: ""; flex: none; margin-left: auto; margin-right: 40px; margin-bottom: -12px;
    width: 180px; height: 90px; border-radius: 180px 180px 0 0;
    background: linear-gradient(120deg, #FFB36B 0%, #FF8A5C 42%, #E86BFF 100%);   /* decoration only: never under words */
    box-shadow: 0 0 0 14px rgba(255,150,100,.14), 0 0 0 30px rgba(255,150,100,.07);
    clip-path: inset(-36px -40px 0 -40px);
  }
  .title {
    /* Regular weight, not the page's light: a card is read at a third of this size in a feed, where the light
       weight's hairlines wash out (looked at, 480px wide, 2026-11-27). 64px for the same reason. */
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 64px;
    line-height: 1.15; letter-spacing: -0.01em; color: #241B2B;
    max-width: 920px; text-wrap: balance;   /* even lines: no single word left alone on the second line */
  }
  .nb { white-space: nowrap; }             /* a hyphenated word never breaks at its hyphen ("Rubber-" / "Stamp") */
  .subtitle {
    font-family: 'Source Sans 3', sans-serif; font-size: 27px; font-weight: 400; line-height: 1.4;
    /* pretty, not balance: the first line stays full and only a lone last word is pulled back. Balance cut
       "planning 2 / wks" in two and set every second line as a narrow block. */
    color: #51475A; margin-top: 24px; max-width: 900px; text-wrap: pretty;
  }
  /* Hero variant (lab-og, screen-og): its own scale and an italic clause on its own line.
     780px measure, not 1000: at the wider measure the hero line wraps to TWO lines and
     leaves a dead band across the middle third of the card. Three lines fill the frame. */
  body.hero .title { font-size: 74px; line-height: 1.16; max-width: 780px; }
  /* display:block puts the italic clause on its OWN line deterministically. Relying on
     the wrap width instead broke a clause across two lines, and the exact break then
     depends on the measure, the font and the string, three things that all move. */
  body.hero .title em { font-style: italic; color: #241B2B; display: block; }
  body.hero .subtitle { display: none; }
  /* Two second-line treatments:
     sub-muted  : screen-og's quiet sans line under the title
     sub-mono   : lab-og's function-signature row; its test count is set heavier, in ink */
  body.hero.sub-muted .subtitle, body.hero.sub-mono .subtitle { display: block; }
  body.hero.sub-muted .subtitle { font-size: 23px; margin-top: 32px; }
  body.hero.sub-mono .subtitle {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0;
    margin-top: 32px; }
  body.hero .subtitle em { font-style: normal; font-weight: 700; color: #241B2B; }
  .byline {
    font-family: 'Source Sans 3', sans-serif; font-size: 19px;
    color: #51475A;
    margin-top: auto;
  }
</style>
</head>
<body>
  <div class="pad">
    <p class="kicker" id="kicker"></p>
    <p class="title" id="title"></p>
    <p class="subtitle" id="subtitle"></p>
    <p class="byline" id="byline"></p>
  </div>
  <script>
    // Read from the query string, not innerHTML injection of raw params — textContent only,
    // so a stray "&" or "<" in a title can never break the layout or inject markup.
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","subtitle","byline"]) {
      document.getElementById(id).textContent = q.get(id) || "";
    }
    // hero=1 switches to the home card's scale; em=<substring of title> is set as an
    // <em> node built with textContent, never innerHTML, so the no-injection rule holds.
    // FIT (2026-11-27, from looking at all 35): a short title set at one fixed size left the lower half of
    // the card empty, and a card is read at a third of its size in a feed. The title takes the largest of
    // three sizes at which it still sits on two lines (three at the smallest). Measured after the site's
    // type has loaded: the stand-in font has other widths and would pick the wrong size.
    if (!q.get("hero")) {
      // a slash stays with the word before it, so no line can begin with "/" ("The Act / Review" + "/ Ignore Rule")
      const t = document.getElementById("title"), words = t.textContent.replace(/ \//g, "\u00A0/").split(" ");
      t.textContent = "";
      words.forEach((w, i) => {
        if (i) t.appendChild(document.createTextNode(" "));
        if (w.includes("-")) { const s = document.createElement("span"); s.className = "nb"; s.textContent = w; t.appendChild(s); }
        else t.appendChild(document.createTextNode(w));
      });
      const lines = () => Math.round(t.getBoundingClientRect().height / parseFloat(getComputedStyle(t).lineHeight));
      const fit = () => { for (const [px, max] of [[84, 2], [72, 2], [64, 3]]) { t.style.fontSize = px + "px"; if (lines() <= max) break; } };
      fit();
      document.fonts.load('400 64px "Source Serif 4"').then(fit);
      document.fonts.ready.then(fit);
    }
    if (q.get("hero")) {
      document.body.classList.add("hero");
      const em = q.get("em"), t = document.getElementById("title"), full = t.textContent;
      const i = em ? full.indexOf(em) : -1;
      if (i >= 0) {
        t.textContent = full.slice(0, i);
        const e = document.createElement("em");
        e.textContent = em;
        t.appendChild(e);
        t.appendChild(document.createTextNode(full.slice(i + em.length)));
      }
      const sub = q.get("sub");
      if (sub) document.body.classList.add("sub-" + sub);
      // subem sets a trailing token of the subtitle (e.g. a test count) heavier, in ink.
      const se = q.get("subem"), st = document.getElementById("subtitle");
      const j = se ? st.textContent.indexOf(se) : -1;
      if (j >= 0) {
        const head = st.textContent.slice(0, j), tail = st.textContent.slice(j + se.length);
        st.textContent = head;
        const e2 = document.createElement("em");
        e2.textContent = se;
        st.appendChild(e2);
        st.appendChild(document.createTextNode(tail));
      }
    }
  </script>
</body>
</html>
