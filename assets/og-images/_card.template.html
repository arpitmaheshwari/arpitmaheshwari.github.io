<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Generic OG-card generator (1200x630). Reads kicker/title/subtitle/byline from the URL query
     string so ONE file renders every card — see tools/generate-og-cards.py for the registry and
     the render loop. Do not hand-edit a -og.png again; that is how 4 of these went stale and 4
     more went missing entirely with no one noticing (2026-08-10 audit, see CANONICAL-FACTS.md).

     Rebuild a single card by hand for testing:
       chrome --headless --window-size=1200,630 --virtual-time-budget=4000 \
         --screenshot=out.png \
         "http://localhost:8000/assets/og-images/_card.template.html?kicker=DESIGN+PATTERN&title=Title+Here&subtitle=Subtitle+here&byline=Arpit+Maheshwari+%C2%B7+Essay"

     Geometry measured from the two known-correct cards (home-og.png, vc-diligence-og.png) on
     2026-08-10: left margin 84px, rule at y~120 (3px thick, 40px wide, gold), kicker baseline
     ~150, title starting ~263. Colors are the site's own tokens (styles.css), not re-guessed. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0A0A0A; /* --bg */
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .pad {
    position: absolute; inset: 0;
    padding: 120px 80px 80px;
    display: flex; flex-direction: column;
  }
  .rule { width: 40px; height: 3px; background: #D4A85E; margin-bottom: 20px; } /* --gold */
  .kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: #D4A85E;
    margin-bottom: 24px;
  }
  .title {
    font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: 56px;
    line-height: 1.18; letter-spacing: -0.01em; color: #F2EDE4; /* --ink */
    max-width: 920px;
  }
  .subtitle {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 25px; font-weight: 400;
    color: #D4A85E; margin-top: 24px; max-width: 900px;
  }
  /* Hero variant (home-og). The home card was hand-made until 2026-08-30 and drifted:
     it still carried the pre-2026-08-29 "Product & Design Leader" positioning and a
     STRAIGHT apostrophe in "won't", baked into pixels where no text gate can see it.
     It is the site's most-shared image, so it keeps its own scale and its italic gold
     clause rather than being flattened into the generic card. Same template, one flag. */
  /* 780px measure, not 1000: at the wider measure the hero line wraps to TWO lines and
     leaves a dead band across the middle third of the card. Three lines is the original
     composition and it fills the frame. */
  body.hero .title { font-size: 74px; line-height: 1.16; max-width: 780px; }
  /* display:block puts the italic clause on its OWN line deterministically. Relying on
     the wrap width instead broke "won’t / bet on it." across two lines, and the exact
     break then depends on the measure, the font and the string — three things that all
     move. The original card breaks the clause whole; this reproduces it by construction. */
  body.hero .title em { font-style: italic; color: #D4A85E; display: block; }
  body.hero .subtitle { display: none; }
  .byline {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 19px;
    color: rgba(242,237,228,0.62); /* --ink-muted */
    margin-top: auto;
  }
</style>
</head>
<body>
  <div class="pad">
    <div class="rule"></div>
    <p class="kicker" id="kicker"></p>
    <p class="title" id="title"></p>
    <p class="subtitle" id="subtitle"></p>
    <p class="byline" id="byline"></p>
  </div>
  <script>
    // Read from the query string, not innerHTML injection of raw params — textContent only,
    // so a stray "&" or "<" in a title can never break the layout or inject markup.
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","subtitle","byline"]) {
      document.getElementById(id).textContent = q.get(id) || "";
    }
    // hero=1 switches to the home card's scale; em=<substring of title> is set as an
    // <em> node built with textContent, never innerHTML, so the no-injection rule holds.
    if (q.get("hero")) {
      document.body.classList.add("hero");
      const em = q.get("em"), t = document.getElementById("title"), full = t.textContent;
      const i = em ? full.indexOf(em) : -1;
      if (i >= 0) {
        t.textContent = full.slice(0, i);
        const e = document.createElement("em");
        e.textContent = em;
        t.appendChild(e);
        t.appendChild(document.createTextNode(full.slice(i + em.length)));
      }
    }
  </script>
</body>
</html>
