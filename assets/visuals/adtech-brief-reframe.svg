<svg viewBox="0 0 1180 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: the brief itself changed shape. The old brief named a place — a billboard on Oxford Street for a month. Once buyers trusted the recommendations, the brief could name an audience and a moment — reach party-lovers on Friday nights, nine PM to one AM — and the system chose the sites.">
  <rect width="1180" height="320" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="288" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
    .qt{font-family:Georgia,serif;fill:#2C2620}
  </style>
  <text x="44" y="52" class="lb" font-size="12" letter-spacing="3">WHAT TRUST UNLOCKED</text>
  <text x="44" y="86" class="hd" font-size="28">The brief itself changed shape.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <rect x="44" y="134" width="480" height="118" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="160" class="lb" font-size="11" letter-spacing="2">BEFORE &#8212; THE BRIEF NAMED A PLACE</text>
  <text x="66" y="192" class="qt" font-size="18" font-style="italic">&#8220;A billboard on Oxford Street</text>
  <text x="66" y="216" class="qt" font-size="18" font-style="italic">for a month.&#8221;</text>
  <text x="66" y="240" class="lb" font-size="11.5">the buyer picked the sites; the system priced them</text>

  <path d="M 524 193 H 632" stroke="#998D78" stroke-width="1.5" fill="none"/>
  <path d="M 632 193 l -9 -4 v 8 z" fill="#998D78"/>
  <text x="578" y="178" class="em" font-size="10" font-style="italic" text-anchor="middle">once the plans</text>
  <text x="578" y="190" class="em" font-size="10" font-style="italic" text-anchor="middle">were believed</text>

  <rect x="656" y="134" width="480" height="118" rx="8" fill="#F2F7F4" stroke="#2F5D52" stroke-width="1.5"/>
  <text x="678" y="160" class="lb" font-size="11" letter-spacing="2">AFTER &#8212; THE BRIEF NAMED AN AUDIENCE AND A MOMENT</text>
  <text x="678" y="192" class="qt" font-size="18" font-style="italic">&#8220;Reach party-lovers on Friday</text>
  <text x="678" y="216" class="qt" font-size="18" font-style="italic">nights, 9 PM to 1 AM.&#8221;</text>
  <text x="678" y="240" class="lb" font-size="11.5">the system chose the sites; the buyer judged the case</text>

  <text x="44" y="286" class="lb" font-size="12" font-style="italic">Adoption was not the end of the work &#8212; it was the thing that made a better question askable.</text>
</svg>
