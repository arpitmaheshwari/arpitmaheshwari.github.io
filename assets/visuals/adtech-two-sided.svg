<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: five connected systems forming a two-sided marketplace. On the demand side, a campaign planner, a creative library and proof-of-play reporting serve advertisers and agencies. On the supply side, free inventory software serves media owners. Between them sits the audience-intelligence platform that profiles movement patterns and the billboards themselves.">
  <rect width="1180" height="420" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="388" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>
  <text x="44" y="52" class="lb" font-size="12" letter-spacing="3">FIVE SYSTEMS, ONE CONNECTED PLATFORM &#183; FIVE YEARS</text>
  <text x="44" y="86" class="hd" font-size="28">A media agency became the market&#8217;s aggregator.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <text x="44" y="136" class="lb" font-size="11" letter-spacing="2">DEMAND &#8212; ADVERTISERS &amp; AGENCIES</text>
  <text x="884" y="136" class="lb" font-size="11" letter-spacing="2" text-anchor="end">SUPPLY &#8212; MEDIA OWNERS</text>

  <!-- demand side -->
  <rect x="44" y="150" width="250" height="66" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="64" y="176" class="ik" font-size="14.5">Campaign planner</text>
  <text x="64" y="196" class="lb" font-size="11">brief in plain language, plans back</text>

  <rect x="44" y="230" width="250" height="66" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="64" y="256" class="ik" font-size="14.5">Creative library</text>
  <text x="64" y="276" class="lb" font-size="11">versioned, scheduled, served to screens</text>

  <rect x="44" y="310" width="250" height="66" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="64" y="336" class="ik" font-size="14.5">Proof-of-play reporting</text>
  <text x="64" y="356" class="lb" font-size="11">evidence it ran &#8212; not on trust</text>

  <!-- centre: audience intelligence -->
  <rect x="386" y="186" width="330" height="120" rx="9" fill="#22201C"/>
  <text x="551" y="216" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="15.5" text-anchor="middle">Audience intelligence</text>
  <text x="551" y="240" fill="#DDD8CB" font-family="'IBM Plex Sans',sans-serif" font-size="11.5" text-anchor="middle">aggregate movement patterns profile people,</text>
  <text x="551" y="258" fill="#DDD8CB" font-family="'IBM Plex Sans',sans-serif" font-size="11.5" text-anchor="middle">then profile every billboard against them</text>
  <text x="551" y="284" fill="#CE9230" font-family="'IBM Plex Sans',sans-serif" font-size="11.5" text-anchor="middle">the thing that let a brief name an audience, not an address</text>

  <!-- supply side -->
  <rect x="808" y="230" width="328" height="66" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="828" y="256" class="ik" font-size="14.5">Free inventory software</text>
  <text x="828" y="276" class="lb" font-size="11">media owners list what they have &#8212; supply comes to the platform</text>

  <!-- connectors -->
  <g stroke="#494338" stroke-width="1.5" fill="none">
    <path d="M 294 183 C 340 183 350 216 380 222"/>
    <path d="M 294 263 H 380"/>
    <path d="M 294 343 C 340 343 350 292 380 272"/>
    <path d="M 716 246 H 802"/>
  </g>
  <g fill="#494338">
    <path d="M 380 222 l -8 -2 1 8 z"/><path d="M 380 263 l -8 -4 v 8 z"/>
    <path d="M 380 272 l -7 -5 v 8 z"/><path d="M 802 246 l -8 -4 v 8 z"/>
  </g>

  <text x="44" y="398" class="lb" font-size="12" font-style="italic">Product definition, roadmap and end-to-end design across all five &#8212; the bidding model and the 50M-bids/hour infrastructure were engineering&#8217;s.</text>
</svg>
