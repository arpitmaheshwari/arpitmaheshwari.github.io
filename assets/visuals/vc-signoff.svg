<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: a partner verdict sits above three signals — A-14, B-02, C-09 — each with an evidence trail that must be opened; the sign-off control stays locked until all three trails have been read, because a verdict a partner clicks through is a verdict they will defend.">
  <rect width="1180" height="360" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="328" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd7{font-family:Georgia,serif;fill:#2C2620}
    .lb7{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik7{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em7{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
    .ok7{font-family:'IBM Plex Sans',sans-serif;fill:#24473F}
  </style>
  <text x="44" y="52" class="lb7" font-size="12" letter-spacing="3">THE LAST STEP IS DELIBERATELY SLOW</text>
  <text x="44" y="86" class="hd7" font-size="28">Sign-off stays locked until the evidence has been read.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- verdict -->
  <rect x="44" y="132" width="300" height="60" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="158" class="ik7" font-size="15">Verdict: proceed, with conditions</text>
  <text x="66" y="178" class="lb7" font-size="11.5">what the partner actually reads</text>

  <!-- three signals with open-state -->
  <g>
    <rect x="404" y="126" width="360" height="52" rx="7" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="424" y="148" class="ik7" font-size="13.5">Signal A-14</text>
    <text x="424" y="166" class="lb7" font-size="10.5">evidence trail &#8212; repo scan &#183; dependency manifest</text>
    <text x="736" y="156" class="ok7" font-size="12" text-anchor="end">opened &#10003;</text>

    <rect x="404" y="190" width="360" height="52" rx="7" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="424" y="212" class="ik7" font-size="13.5">Signal B-02</text>
    <text x="424" y="230" class="lb7" font-size="10.5">evidence trail &#8212; design docs &#183; infra audit</text>
    <text x="736" y="220" class="ok7" font-size="12" text-anchor="end">opened &#10003;</text>

    <rect x="404" y="254" width="360" height="52" rx="7" fill="#FBF4E6" stroke="#C0512B" stroke-width="1.5"/>
    <text x="424" y="276" class="ik7" font-size="13.5">Signal C-09</text>
    <text x="424" y="294" class="lb7" font-size="10.5">evidence trail &#8212; commit history, 24 months</text>
    <text x="736" y="284" class="em7" font-size="12" text-anchor="end">not yet opened</text>
  </g>
  <path d="M 344 162 C 374 162 380 152 398 152" stroke="#494338" stroke-width="1.5" fill="none"/>
  <path d="M 398 152 l -8 -3 v 7 z" fill="#494338"/>

  <!-- the lock -->
  <rect x="824" y="190" width="312" height="116" rx="9" fill="#22201C"/>
  <text x="846" y="222" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="15">Partner sign-off</text>
  <text x="846" y="246" fill="#C0512B" font-family="'IBM Plex Sans',sans-serif" font-size="12.5">locked &#8212; 1 trail unread</text>
  <text x="846" y="272" fill="#DAD4C6" font-family="'IBM Plex Sans',sans-serif" font-size="11">a verdict a partner clicks through is a verdict</text>
  <text x="846" y="288" fill="#DAD4C6" font-family="'IBM Plex Sans',sans-serif" font-size="11">they&#8217;ll defend in the investment committee</text>
  <g stroke="#494338" stroke-width="1.2" fill="none" opacity=".6">
    <path d="M 764 152 C 800 152 806 216 818 220"/>
    <path d="M 764 216 C 794 216 800 232 818 238"/>
    <path d="M 764 280 C 794 280 800 262 818 258" stroke-dasharray="4 3"/>
  </g>

  <text x="44" y="336" class="lb7" font-size="12" font-style="italic">The friction is the product &#8212; slowing the user down at exactly one moment is what let everything else go fast.</text>
</svg>
