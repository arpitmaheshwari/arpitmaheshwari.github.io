<svg viewBox="0 0 600 98" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: the engine produced a ranked list of billboards — correct, and impossible to defend in a room; the screen turned it into a full campaign plan carrying its KPIs and the reasoning behind it, so a trader could argue with it.">
  <rect width="600" height="98" fill="#F4ECDA"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>

  <text x="0" y="10" class="lb" font-size="10" letter-spacing="1.6">THE DESIGN MOVE</text>
  <text x="0" y="32" class="hd" font-size="17">The model didn&#8217;t change. What it handed over did.</text>
  <line x1="0" y1="41" x2="600" y2="41" stroke="rgba(44,38,32,0.20)"/>

  <!-- what the engine produced -->
  <rect x="0" y="50" width="236" height="48" rx="4" fill="#EEE4CE" stroke="rgba(44,38,32,.20)"/>
  <text x="12" y="66" class="lb" font-size="10" letter-spacing="1.2">WHAT THE ENGINE PRODUCED</text>
  <text x="12" y="81" class="ik" font-size="12.5">A ranked list of billboards</text>
  <text x="12" y="93" class="em" font-size="10.5">correct, and impossible to defend in a room</text>

  <!-- the screen between -->
  <path d="M 244 74 H 300" stroke="#998D78" stroke-width="1.4" fill="none"/>
  <path d="M 300 74 l -6 -3.4 v 6.8 z" fill="#998D78"/>
  <text x="272" y="66" class="lb" font-size="10" text-anchor="middle">the screen</text>

  <!-- what the trader received -->
  <rect x="308" y="50" width="292" height="48" rx="4" fill="#22201C"/>
  <text x="320" y="66" fill="#CE9230" font-family="'IBM Plex Sans',sans-serif" font-size="10" letter-spacing="1.2">WHAT THE TRADER RECEIVED</text>
  <text x="320" y="81" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="12.5">A full campaign plan</text>
  <text x="320" y="93" fill="#B6A98D" font-family="'IBM Plex Sans',sans-serif" font-size="10.5">its KPIs and its reasoning, on the card &#8212; arguable</text>
</svg>
