<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: the model's raw output is a ranked list of billboards; the screen turns it into a full campaign plan carrying its KPIs and the reasoning behind it, customisable in one click; the trader's edit is logged and feeds the next round of recommendations.">
  <rect width="1180" height="400" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="368" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>
  <text x="44" y="52" class="lb" font-size="12" letter-spacing="3">THE DESIGN MOVE</text>
  <text x="44" y="86" class="hd" font-size="28">The model didn&#8217;t change. What it handed over did.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- before -->
  <rect x="44" y="136" width="300" height="150" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="162" class="lb" font-size="11" letter-spacing="2">WHAT THE ENGINE PRODUCED</text>
  <text x="66" y="190" class="ik" font-size="16">A ranked list of billboards</text>
  <text x="66" y="216" class="lb" font-size="12">correct, and impossible to defend in a room</text>
  <text x="66" y="240" class="lb" font-size="12">no case, no cost of being wrong,</text>
  <text x="66" y="258" class="lb" font-size="12">nothing to adjust</text>
  <text x="66" y="278" class="em" font-size="11.5">traders read it, then played their hunches</text>

  <!-- arrow -->
  <path d="M 344 211 H 420" stroke="#998D78" stroke-width="1.5" fill="none"/>
  <path d="M 420 211 l -8 -4 v 8 z" fill="#998D78"/>
  <text x="382" y="196" class="lb" font-size="10" font-style="italic" text-anchor="middle">the screen</text>
  <text x="382" y="208" class="lb" font-size="10" font-style="italic" text-anchor="middle">between</text>

  <!-- after -->
  <rect x="434" y="136" width="360" height="150" rx="8" fill="#F2F7F4" stroke="#2F5D52" stroke-width="1.5"/>
  <text x="456" y="162" class="lb" font-size="11" letter-spacing="2">WHAT THE TRADER RECEIVED</text>
  <text x="456" y="190" class="ik" font-size="16" font-weight="600">A full campaign plan</text>
  <text x="456" y="216" class="lb" font-size="12">&#183; reach, budget, formats, locations</text>
  <text x="456" y="234" class="lb" font-size="12">&#183; the KPIs it will be judged on, attached</text>
  <text x="456" y="252" class="lb" font-size="12">&#183; the reasoning on the card &#8212; which audiences,</text>
  <text x="466" y="270" class="lb" font-size="12">which environments, what trade-off</text>

  <!-- customize + loop -->
  <rect x="850" y="136" width="286" height="66" rx="8" fill="#EEE4CE" stroke="#CE9230" stroke-width="1.5"/>
  <text x="872" y="162" class="ik" font-size="15">Customize in one click</text>
  <text x="872" y="182" class="lb" font-size="11.5">disagreement is a control, not a dead end</text>
  <path d="M 794 178 H 844" stroke="#998D78" stroke-width="1.5" fill="none"/>
  <path d="M 844 178 l -8 -4 v 8 z" fill="#998D78"/>

  <rect x="850" y="220" width="286" height="66" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="872" y="246" class="ik" font-size="15">Every edit logged</text>
  <text x="872" y="266" class="lb" font-size="11.5">and fed into next week&#8217;s recommendations</text>
  <path d="M 993 202 V 216" stroke="#CE9230" stroke-width="1.5" fill="none"/>
  <path d="M 993 216 l -4 -7 h 8 z" fill="#CE9230"/>

  <path d="M 850 253 C 700 253 640 320 500 320 C 380 320 300 312 194 300" stroke="#CE9230" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M 194 300 l 8 -3 -1 8 z" fill="#CE9230"/>
  <text x="520" y="340" class="lb" font-size="11" font-style="italic">fighting the model turns into coaching it</text>

  <text x="44" y="372" class="lb" font-size="12" font-style="italic">No confidence score ever reached a trader. The unit of trust was a plan they could argue with.</text>
</svg>
