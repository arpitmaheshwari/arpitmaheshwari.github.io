<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Launch gate diagram: two conditions — every claim carries a cited source, and thin evidence draws an abstention — each shown with the failure it prevents, gating the release.">
  <rect width="1180" height="360" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="328" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd2{font-family:Georgia,serif;fill:#2C2620}
    .lb2{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik2{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em2{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>
  <text x="44" y="52" class="lb2" font-size="12" letter-spacing="3">WHAT SHIPPED BEFORE RELEASE</text>
  <text x="44" y="86" class="hd2" font-size="28">Two conditions, and the failure each one bought off.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- condition 1 -->
  <rect x="44" y="132" width="470" height="104" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="160" class="lb2" font-size="11" letter-spacing="2">CONDITION 01</text>
  <text x="66" y="186" class="ik2" font-size="16">Every generated number carries its source</text>
  <text x="66" y="212" class="lb2" font-size="12">3 sources behind a score, inline &#8212; not in a tooltip</text>
  <text x="66" y="228" class="em2" font-size="11.5">prevents: a confident figure nobody can check on deal day</text>

  <!-- condition 2 -->
  <rect x="544" y="132" width="592" height="104" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="566" y="160" class="lb2" font-size="11" letter-spacing="2">CONDITION 02</text>
  <text x="566" y="186" class="ik2" font-size="16">Thin evidence draws an abstention</text>
  <text x="566" y="212" class="lb2" font-size="12">a visible &#8220;I&#8217;m not sure about this one&#8221;</text>
  <text x="566" y="228" class="em2" font-size="11.5">prevents: a fluent hallucination entering a capital decision</text>

  <!-- gate bar -->
  <rect x="44" y="264" width="1092" height="46" rx="6" fill="#22201C"/>
  <text x="66" y="292" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="14">Ship</text>
  <text x="120" y="292" fill="#B6A98D" font-family="'IBM Plex Sans',sans-serif" font-size="12.5">&#8212; only once both are true. Until then the model was accurate and unusable.</text>
  <text x="1116" y="292" fill="#CE9230" font-family="'IBM Plex Sans',sans-serif" font-size="12.5" text-anchor="end">cost: weeks of delay</text>

  <!-- vertical connectors -->
  <g stroke="#998D78" stroke-width="1.5" fill="none">
    <path d="M 279 236 V 264"/><path d="M 779 236 V 264"/>
  </g>
  <text x="44" y="336" class="lb2" font-size="12" font-style="italic">The trade only pays when the reader is an expert paid to doubt the answer. For a low-stakes call nobody audits, holding the launch would have been wrong.</text>
</svg>
