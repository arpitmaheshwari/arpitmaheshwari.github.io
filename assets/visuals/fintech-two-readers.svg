<svg viewBox="0 0 1180 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: one underlying analysis rendered two ways — a written descriptive report and a conversational interrogation — both sitting over a pipeline-wide scoring dashboard, with citations shared by both.">
  <rect width="1180" height="392" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="360" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd3{font-family:Georgia,serif;fill:#2C2620}
    .lb3{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik3{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
  </style>
  <text x="44" y="52" class="lb3" font-size="12" letter-spacing="3">ONE ANALYSIS, TWO READERS</text>
  <text x="44" y="86" class="hd3" font-size="28">The design refused to pick a temperament for them.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- the single analysis -->
  <rect x="452" y="126" width="276" height="52" rx="7" fill="#22201C"/>
  <text x="590" y="148" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="14" text-anchor="middle">One analysis</text>
  <text x="590" y="166" fill="#B6A98D" font-family="'IBM Plex Sans',sans-serif" font-size="11" text-anchor="middle">scored, cited, abstaining where thin</text>

  <!-- two renderings -->
  <rect x="96" y="204" width="418" height="72" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="118" y="230" class="ik3" font-size="15">A written report</text>
  <text x="118" y="250" class="lb3" font-size="11.5">the scores argued in prose &#8212; for the reader who wants</text>
  <text x="118" y="266" class="lb3" font-size="11.5">the case made once, in order</text>

  <rect x="666" y="204" width="418" height="72" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="688" y="230" class="ik3" font-size="15">A conversation</text>
  <text x="688" y="250" class="lb3" font-size="11.5">interrogate any line &#8212; for the reader who arrives</text>
  <text x="688" y="266" class="lb3" font-size="11.5">with one question and no patience</text>

  <g stroke="#998D78" stroke-width="1.5" fill="none">
    <path d="M 500 178 C 420 178 360 190 305 204"/>
    <path d="M 680 178 C 760 178 820 190 875 204"/>
  </g>
  <path d="M 305 204 l 1 -8 6 5 z" fill="#998D78"/>
  <path d="M 875 204 l -6 -3 -1 8 z" fill="#998D78"/>

  <!-- the shared surface BOTH modes sit over — full width, as the base -->
  <rect x="96" y="292" width="988" height="46" rx="7" fill="#F4ECDA" stroke="rgba(44,38,32,.16)" stroke-dasharray="4 4"/>
  <text x="118" y="320" class="ik3" font-size="13.5">Pipeline dashboard</text>
  <text x="240" y="320" class="lb3" font-size="11.5">every live deal in one view &#8212; the surface both readers return to</text>
  <g stroke="#998D78" stroke-width="1.5" fill="none" opacity=".6">
    <path d="M 305 276 V 292"/><path d="M 875 276 V 292"/>
  </g>

  <text x="44" y="366" class="lb3" font-size="12" font-style="italic">Same evidence underneath both. Citations travel with the claim, whichever way it is read.</text>
</svg>
