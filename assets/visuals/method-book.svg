<svg viewBox="0 0 460 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mbt mbd">
  <title id="mbt">The method in three acts</title>
  <desc id="mbd">Three rows: a three-circle wager, a four-move loop, and an MVP-to-version-n staircase whose learnings feed back up into the loop.</desc>

  <!-- feedback spine: stairs learnings return to the loop -->
  <path d="M 24 306 C -4 268, -4 190, 24 158" fill="none" stroke="#998D78" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 18 166 L 24 156 L 30 166" fill="none" stroke="#998D78" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- ROW I · the wager -->
  <g fill="none" stroke="rgba(44,38,32,.38)" stroke-width="1.4">
    <circle cx="48" cy="44" r="24"/><circle cx="76" cy="44" r="24"/><circle cx="62" cy="68" r="24"/>
  </g>
  <circle cx="62" cy="51" r="4.5" fill="#C0512B"/>
  <text x="128" y="44" font-family="Georgia, serif" font-size="16" fill="#2C2620"><tspan fill="#C0512B" font-style="italic">I · </tspan>The wager worth making</text>
  <text x="128" y="66" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">desirable · feasible · viable — the overlap</text>
  <text x="128" y="84" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">is the bet; the rest dies in review</text>

  <!-- ROW II · the spiral -->
  <circle cx="62" cy="180" r="30" fill="none" stroke="rgba(44,38,32,.38)" stroke-width="1.4"/>
  <path d="M 62 150 A 30 30 0 0 1 92 180" fill="none" stroke="#C0512B" stroke-width="2.2"/>
  <path d="M 89 169 L 92 180 L 83 175" fill="none" stroke="#C0512B" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#CE9230"><circle cx="62" cy="150" r="3"/><circle cx="92" cy="180" r="3"/><circle cx="62" cy="210" r="3"/><circle cx="32" cy="180" r="3"/></g>
  <text x="128" y="172" font-family="Georgia, serif" font-size="16" fill="#2C2620"><tspan fill="#C0512B" font-style="italic">II · </tspan>The spiral</text>
  <text x="128" y="194" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">Listen → Structure → Prove → Land, × n —</text>
  <text x="128" y="212" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">every loop ends in front of a user</text>

  <!-- ROW III · the open loop -->
  <g font-family="Georgia, serif" font-size="10" text-anchor="middle">
    <rect x="22" y="300" width="34" height="22" rx="4" fill="none" stroke="#2F5D52" stroke-width="1.6"/>
    <text x="39" y="315" fill="#2F5D52">MVP</text>
    <rect x="62" y="282" width="34" height="22" rx="4" fill="none" stroke="rgba(44,38,32,.38)" stroke-width="1.4"/>
    <text x="79" y="297" fill="#2C2620">V1</text>
    <rect x="102" y="264" width="34" height="22" rx="4" fill="none" stroke="#CE9230" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="119" y="279" fill="#CE9230">V·n</text>
  </g>
  <path d="M 119 264 L 119 250" stroke="#C0512B" stroke-width="1.8" fill="none"/>
  <path d="M 114 257 L 119 249 L 124 257" stroke="#C0512B" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <text x="128" y="296" font-family="Georgia, serif" font-size="16" fill="#2C2620" transform="translate(30,0)"><tspan fill="#C0512B" font-style="italic">III · </tspan>The loop that never closes</text>
  <text x="158" y="318" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">shipping is the first honest data — what users</text>
  <text x="158" y="336" font-family="Georgia, serif" font-size="12.5" fill="#6A6052">do returns as the next brief</text>
</svg>