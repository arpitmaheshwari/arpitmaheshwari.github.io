<svg viewBox="0 0 1280 440" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt pd">
  <title id="pt">The method: wager, spiral, loop</title>
  <desc id="pd">Three acts: a three-circle wager (desirable, feasible, viable); a four-move spiral — listen, structure, prove, land — repeated in loops; and an execution staircase from MVP to version n whose learnings feed back into the spiral.</desc>
  <rect width="1280" height="440" fill="#F4ECDA"/>

  <!-- ACT I -->
  <text x="60" y="56" font-family="ui-monospace, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8A6423">ACT I — THE WAGER</text>
  <g fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5">
    <circle cx="190" cy="190" r="70"/>
    <circle cx="268" cy="190" r="70"/>
    <circle cx="229" cy="256" r="70"/>
  </g>
  <text x="128" y="132" font-family="Georgia, serif" font-size="18" fill="#2C2620">Desirable</text>
  <text x="278" y="132" font-family="Georgia, serif" font-size="18" fill="#2C2620">Feasible</text>
  <text x="196" y="358" font-family="Georgia, serif" font-size="18" fill="#2C2620">Viable</text>
  <circle cx="229" cy="210" r="6" fill="#8A6423"/>
  <text x="229" y="408" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6A6052">the overlap is the bet worth making</text>

  <!-- ACT II -->
  <text x="500" y="56" font-family="ui-monospace, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8A6423">ACT II — THE SPIRAL</text>
  <circle cx="640" cy="225" r="95" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
  <path d="M 640 130 A 95 95 0 0 1 735 225" fill="none" stroke="#8A6423" stroke-width="2.5"/>
  <path d="M 731 210 L 735 225 L 723 218" fill="none" stroke="#8A6423" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-family="Georgia, serif" font-size="19" fill="#2C2620" text-anchor="middle">
    <text x="640" y="112">Listen</text>
    <text x="782" y="231">Structure</text>
    <text x="640" y="352">Prove</text>
    <text x="500" y="231">Land</text>
  </g>
  <text x="640" y="220" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="23" fill="#8A6423">× n loops</text>
  <text x="640" y="408" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6A6052">every loop ends in front of a user</text>

  <!-- ACT III -->
  <text x="920" y="56" font-family="ui-monospace, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#8A6423">ACT III — THE OPEN LOOP</text>
  <g font-family="Georgia, serif" font-size="15" text-anchor="middle">
    <rect x="905" y="285" width="72" height="40" rx="6" fill="none" stroke="#2F5D52" stroke-width="2"/>
    <text x="941" y="310" fill="#2F5D52">MVP</text>
    <rect x="995" y="245" width="72" height="40" rx="6" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
    <text x="1031" y="270" fill="#2C2620">V1</text>
    <rect x="1085" y="205" width="72" height="40" rx="6" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
    <text x="1121" y="230" fill="#2C2620">V2</text>
    <rect x="1175" y="165" width="72" height="40" rx="6" fill="none" stroke="#8F5E10" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1211" y="190" fill="#8F5E10">V·n</text>
  </g>
  <g stroke="#6F6350" stroke-width="1.5" fill="none">
    <path d="M 977 300 L 992 285"/><path d="M 1067 260 L 1082 245"/><path d="M 1157 220 L 1172 205"/>
  </g>
  <text x="1211" y="132" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#8A6423">adoption</text>
  <path d="M 1211 165 L 1211 144" stroke="#8A6423" stroke-width="2" fill="none"/>
  <path d="M 1205 154 L 1211 144 L 1217 154" stroke="#8A6423" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M 941 325 C 941 396, 790 396, 748 316" fill="none" stroke="#6F6350" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M 755 332 L 748 316 L 764 322" fill="none" stroke="#6F6350" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="1080" y="408" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6A6052">what users do returns as the next brief</text>
</svg>