<svg viewBox="0 0 1280 470" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt pd">
  <title id="pt">The method: wager, spiral, loop</title>
  <desc id="pd">Three acts: a three-circle wager (desirable, feasible, viable), a four-move spiral repeated in loops that each end in front of a user, and an execution staircase from MVP to version n whose learnings feed back into the spiral.</desc>
  <rect width="1280" height="470" fill="#F4ECDA"/>

  <!-- ============ ACT I — THE WAGER ============ -->
  <text x="60" y="52" font-family="ui-monospace, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#A87B2E">ACT I — THE WAGER WORTH MAKING</text>
  <g fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5">
    <circle cx="185" cy="180" r="72"/>
    <circle cx="265" cy="180" r="72"/>
    <circle cx="225" cy="248" r="72"/>
  </g>
  <text x="120" y="120" font-family="Georgia, serif" font-size="17" fill="#2C2620">Desirable</text>
  <text x="272" y="120" font-family="Georgia, serif" font-size="17" fill="#2C2620">Feasible</text>
  <text x="188" y="352" font-family="Georgia, serif" font-size="17" fill="#2C2620">Viable</text>
  <text x="86" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#6A6052">wanted by the market</text>
  <text x="278" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#6A6052">buildable now</text>
  <text x="252" y="352" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#6A6052">worth the business</text>
  <circle cx="225" cy="202" r="6" fill="#A87B2E"/>
  <text x="225" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6A6052">the overlap is the bet worth making —</text>
  <text x="225" y="422" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6A6052">everything outside it dies in review</text>

  <!-- ============ ACT II — THE SPIRAL ============ -->
  <text x="480" y="52" font-family="ui-monospace, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#A87B2E">ACT II — THE SPIRAL</text>
  <circle cx="640" cy="225" r="100" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
  <path d="M 640 125 A 100 100 0 0 1 740 225" fill="none" stroke="#A87B2E" stroke-width="2.5"/>
  <path d="M 736 210 L 740 225 L 728 218" fill="none" stroke="#A87B2E" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-family="Georgia, serif" font-size="18" fill="#2C2620" text-anchor="middle">
    <text x="640" y="105">Listen</text>
    <text x="775" y="230">Structure</text>
    <text x="640" y="362">Prove</text>
    <text x="507" y="230">Land</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6A6052" text-anchor="middle">
    <text x="640" y="88">the problem space, in its own words</text>
    <text x="782" y="247">journeys · information architecture</text>
    <text x="640" y="379">prototypes, rough → real</text>
    <text x="502" y="247">visual design · tone</text>
  </g>
  <text x="640" y="210" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#A87B2E">× n loops</text>
  <text x="640" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6A6052">every loop ends</text>
  <text x="640" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6A6052">in front of a user</text>
  <text x="640" y="422" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6A6052">research is a rhythm, not a phase</text>

  <!-- ============ ACT III — THE LOOP THAT NEVER CLOSES ============ -->
  <text x="880" y="52" font-family="ui-monospace, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#A87B2E">ACT III — THE LOOP THAT NEVER CLOSES</text>
  <g font-family="Georgia, serif" font-size="15" text-anchor="middle">
    <rect x="905" y="285" width="72" height="40" rx="6" fill="none" stroke="#2F5D52" stroke-width="2"/>
    <text x="941" y="310" fill="#2F5D52">MVP</text>
    <rect x="995" y="245" width="72" height="40" rx="6" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
    <text x="1031" y="270" fill="#2C2620">V1</text>
    <rect x="1085" y="205" width="72" height="40" rx="6" fill="none" stroke="rgba(44,38,32,0.30)" stroke-width="1.5"/>
    <text x="1121" y="230" fill="#2C2620">V2</text>
    <rect x="1175" y="165" width="72" height="40" rx="6" fill="none" stroke="#B27B1E" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1211" y="190" fill="#B27B1E">V·n</text>
  </g>
  <g stroke="#998D78" stroke-width="1.5" fill="none">
    <path d="M 977 300 L 992 285"/><path d="M 1067 260 L 1082 245"/><path d="M 1157 220 L 1172 205"/>
  </g>
  <text x="1211" y="130" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#A87B2E">adoption</text>
  <path d="M 1211 165 L 1211 142" stroke="#A87B2E" stroke-width="2" fill="none"/>
  <path d="M 1205 152 L 1211 142 L 1217 152" stroke="#A87B2E" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M 941 325 C 941 400, 780 400, 745 320" fill="none" stroke="#998D78" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M 752 336 L 745 320 L 761 326" fill="none" stroke="#998D78" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="960" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6A6052">what users do returns as the next brief</text>
  <text x="1080" y="422" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6A6052">shipping is the first honest data</text>

  <line x1="60" y1="448" x2="1220" y2="448" stroke="rgba(44,38,32,0.30)" stroke-width="1"/>
</svg>