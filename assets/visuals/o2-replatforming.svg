<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: the legacy MyO2 system was rebuilt as one responsive build, serving iOS, Android, Windows Phone and desktop web from the same code — moved cautiously, with millions of subscribers aboard, in step with Telefónica's branding, marketing and copywriting teams.">
  <rect width="1180" height="360" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="328" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd5{font-family:Georgia,serif;fill:#2C2620}
    .lb5{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik5{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
  </style>
  <text x="44" y="52" class="lb5" font-size="12" letter-spacing="3">MYO2 &#8212; A REPLATFORMING, NOT A FRESH START</text>
  <text x="44" y="86" class="hd5" font-size="28">One legacy system. One responsive build. Every pocket it had to fit.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <rect x="44" y="150" width="230" height="90" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="180" class="lb5" font-size="11" letter-spacing="2">BEFORE</text>
  <text x="66" y="206" class="ik5" font-size="15">The legacy system</text>
  <text x="66" y="228" class="lb5" font-size="11.5">millions of subscribers living on it</text>

  <rect x="360" y="150" width="270" height="90" rx="8" fill="#22201C"/>
  <text x="382" y="180" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="15">One responsive build</text>
  <text x="382" y="202" fill="#DDD8CB" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">the same code, every screen size &#8212;</text>
  <text x="382" y="220" fill="#DDD8CB" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">co-designed; front-end all mine</text>

  <path d="M 274 195 H 354" stroke="#494338" stroke-width="1.5" fill="none"/>
  <path d="M 354 195 l -8 -4 v 8 z" fill="#494338"/>
  <text x="314" y="172" class="lb5" font-size="10" font-style="italic" text-anchor="middle">rebuilt,</text>
  <text x="314" y="184" class="lb5" font-size="10" font-style="italic" text-anchor="middle">cautiously</text>

  <!-- four surfaces: ONE column — the 2x2 grid forced connector lines straight through
       the left column's labels (caught on render, 2026-08-07) -->
  <g>
    <rect x="774" y="122" width="220" height="42" rx="6" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="884" y="148" class="ik5" font-size="13" text-anchor="middle">iOS</text>
    <rect x="774" y="176" width="220" height="42" rx="6" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="884" y="202" class="ik5" font-size="13" text-anchor="middle">Android</text>
    <rect x="774" y="230" width="220" height="42" rx="6" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="884" y="256" class="ik5" font-size="13" text-anchor="middle">Windows Phone</text>
    <rect x="774" y="284" width="220" height="42" rx="6" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
    <text x="884" y="310" class="ik5" font-size="13" text-anchor="middle">Desktop web</text>
  </g>
  <g stroke="#494338" stroke-width="1.5" fill="none">
    <path d="M 630 178 C 690 178 706 143 768 143"/>
    <path d="M 630 192 C 690 192 706 197 768 197"/>
    <path d="M 630 206 C 690 206 706 251 768 251"/>
    <path d="M 630 220 C 690 220 706 305 768 305"/>
  </g>
  <g fill="#494338">
    <path d="M 768 143 l -8 -4 v 8 z"/><path d="M 768 197 l -8 -4 v 8 z"/>
    <path d="M 768 251 l -8 -4 v 8 z"/><path d="M 768 305 l -8 -4 v 8 z"/>
  </g>
  <text x="1016" y="200" class="lb5" font-size="11" font-style="italic">the same code,</text>
  <text x="1016" y="216" class="lb5" font-size="11" font-style="italic">four surfaces</text>
  <text x="44" y="290" class="lb5" font-size="12" font-style="italic">Moved cautiously &#8212; you don&#8217;t switch a population&#8217;s billing screen overnight &#8212; in step with</text>
  <text x="44" y="310" class="lb5" font-size="12" font-style="italic">Telef&#243;nica&#8217;s branding, marketing and copywriting teams, so every screen shipped speaking O2&#8217;s voice.</text>
</svg>
