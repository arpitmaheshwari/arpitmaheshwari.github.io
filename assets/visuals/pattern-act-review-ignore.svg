<svg viewBox="0 0 1280 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The Act / Review / Ignore rule</title>
  <desc id="d">Three model scores — ninety-two, sixty-one and twenty-three — each resolving to exactly one verb: act with a visible override, review with the reasons named, or ignore where the model declines to bluff.</desc>
  <rect x="0" y="0" width="1280" height="400" fill="#F4ECDA"/>

  <!-- Title block -->
  <text x="36" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#2C2620">The Act / Review / Ignore Rule</text>
  <text x="36" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#6A6052">One score, one action &#8212; a number never reaches the screen alone.</text>
  <line x1="36" y1="126" x2="1244" y2="126" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>

  <!-- ===== ACT ===== -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="380" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="24" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#6F6350">SCORE 92 &#183; HIGH</text>
    <text x="24" y="98" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#2F5D52">&#8594; Act</text>
    <text x="24" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6A6052">signals named &#183; safe to run</text>
    <rect x="24" y="154" width="150" height="34" rx="6" fill="#2F5D52"/>
    <text x="46" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#F4ECDA">Apply</text>
    <rect x="186" y="154" width="132" height="34" rx="6" fill="none" stroke="#2F5D52" stroke-width="1.5"/>
    <text x="204" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2F5D52">Override &#8630;</text>
  </g>

  <!-- ===== REVIEW ===== -->
  <g transform="translate(450,150)">
    <rect x="0" y="0" width="380" height="214" rx="10" fill="#EEE4CE" stroke="#A06C0E" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#6F6350">SCORE 61 &#183; MIXED</text>
    <text x="24" y="98" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#A06C0E">&#8594; Review</text>
    <text x="24" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6A6052">reasons on the card, not a tooltip:</text>
    <line x1="24" y1="150" x2="356" y2="150" stroke="rgba(44,38,32,0.15)" stroke-width="1"/>
    <text x="24" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5C5346">&#8212; recency conflict, panels 12 &amp; 14</text>
    <text x="24" y="194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5C5346">&#8212; surfaced for a human &#183; never auto-run</text>
  </g>

  <!-- ===== IGNORE ===== -->
  <g transform="translate(860,150)">
    <rect x="0" y="0" width="380" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="24" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#6F6350">SCORE 23 &#183; LOW</text>
    <text x="24" y="98" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#8A7B63">Ignore</text>
    <text x="24" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6A6052">below the line, the model</text>
    <text x="24" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6A6052">declines to bluff &#8212; the honest no</text>
    <text x="24" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6A6052">is what makes the act believable.</text>
  </g>
</svg>
