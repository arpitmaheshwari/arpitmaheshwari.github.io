<svg viewBox="0 0 1280 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Provenance &amp; Citations pattern</title>
  <desc id="d">A claim card linked to its three cited sources &#8212; one flagged as dissenting &#8212; and the original source document opened to the cited passage.</desc>
  <rect x="0" y="0" width="1280" height="400" fill="#F4ECDA"/>

  <!-- Title block -->
  <text x="36" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#2C2620">Provenance &amp; Citations</text>
  <text x="36" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#6A6052">Every claim traced to the source behind it.</text>
  <line x1="36" y1="126" x2="1244" y2="126" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>

  <!-- ===== LEFT: Claim card ===== -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="386" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#998D78">CLAIM</text>

    <!-- result card -->
    <rect x="24" y="60" width="338" height="120" rx="9" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>

    <!-- serif claim line -->
    <text x="44" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2620">Architecture risk:</text>
    <text x="44" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#C0512B">72</text>

    <!-- sources tag pill -->
    <rect x="232" y="118" width="106" height="34" rx="17" fill="#2F5D52"/>
    <text x="285" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDA">3 sources</text>
  </g>

  <!-- connector -->
  <path d="M 434 257 H 480" fill="none" stroke="rgba(44,38,32,0.12)" stroke-width="2"/>
  <path d="M 474 251 L 482 257 L 474 263 Z" fill="#998D78"/>

  <!-- ===== MIDDLE: Sources list ===== -->
  <g transform="translate(490,150)">
    <rect x="0" y="0" width="430" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#998D78">SOURCES</text>

    <!-- Source row 1: Q3 filing (green check) -->
    <rect x="24" y="54" width="382" height="42" rx="8" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <rect x="40" y="66" width="14" height="18" rx="2" fill="none" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="72" x2="50" y2="72" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="76" x2="50" y2="76" stroke="#998D78" stroke-width="1.5"/>
    <text x="70" y="81" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#2C2620">Q3 filing</text>
    <circle cx="372" cy="75" r="11" fill="#2F5D52"/>
    <path d="M 367 75 L 371 79 L 378 71" fill="none" stroke="#F4ECDA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Source row 2: Eng. audit (green check) -->
    <rect x="24" y="104" width="382" height="42" rx="8" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <rect x="40" y="116" width="14" height="18" rx="2" fill="none" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="122" x2="50" y2="122" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="126" x2="50" y2="126" stroke="#998D78" stroke-width="1.5"/>
    <text x="70" y="131" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#2C2620">Eng. audit</text>
    <circle cx="372" cy="125" r="11" fill="#2F5D52"/>
    <path d="M 367 125 L 371 129 L 378 121" fill="none" stroke="#F4ECDA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Source row 3: Founder call (ochre dot, disagrees) -->
    <rect x="24" y="154" width="382" height="42" rx="8" fill="#F4ECDA" stroke="#CE9230" stroke-width="1.5"/>
    <rect x="40" y="166" width="14" height="18" rx="2" fill="none" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="172" x2="50" y2="172" stroke="#998D78" stroke-width="1.5"/>
    <line x1="44" y1="176" x2="50" y2="176" stroke="#998D78" stroke-width="1.5"/>
    <text x="70" y="181" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#2C2620">Founder call</text>
    <text x="356" y="180" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-style="italic" fill="#CE9230">disagrees</text>
    <circle cx="372" cy="175" r="6" fill="#CE9230"/>
  </g>

  <!-- connector -->
  <path d="M 928 257 H 974" fill="none" stroke="rgba(44,38,32,0.12)" stroke-width="2"/>
  <path d="M 968 251 L 976 257 L 968 263 Z" fill="#998D78"/>

  <!-- ===== RIGHT: Source document ===== -->
  <g transform="translate(984,150)">
    <rect x="0" y="0" width="260" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="22" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#998D78">SOURCE DOC</text>

    <!-- mini page -->
    <rect x="56" y="54" width="148" height="138" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>

    <!-- text lines (faint) -->
    <line x1="72" y1="74" x2="188" y2="74" stroke="#998D78" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="90" x2="172" y2="90" stroke="#998D78" stroke-width="3" stroke-linecap="round"/>

    <!-- highlighted cited passage -->
    <rect x="64" y="100" width="132" height="20" rx="3" fill="rgba(192,81,43,0.18)"/>
    <line x1="72" y1="110" x2="188" y2="110" stroke="#C0512B" stroke-width="3" stroke-linecap="round"/>

    <line x1="72" y1="132" x2="160" y2="132" stroke="#998D78" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="148" x2="188" y2="148" stroke="#998D78" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="164" x2="148" y2="164" stroke="#998D78" stroke-width="3" stroke-linecap="round"/>

    <text x="130" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6A6052">Cited passage</text>
  </g>
</svg>
