<svg viewBox="0 0 600 134" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Launch gate diagram: two conditions — every generated number carries its source, and thin evidence draws an abstention — each shown with the failure it prevents; the release ships only once both are true.">
  <rect width="600" height="134" fill="#F4ECDA"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>

  <text x="0" y="10" class="lb" font-size="10" letter-spacing="1.6">WHAT SHIPPED BEFORE RELEASE</text>
  <text x="0" y="32" class="hd" font-size="17">Two conditions, and the failure each one bought off.</text>
  <line x1="0" y1="41" x2="600" y2="41" stroke="rgba(44,38,32,0.20)"/>

  <!-- condition 01 -->
  <rect x="0" y="50" width="288" height="56" rx="4" fill="#EEE4CE" stroke="rgba(44,38,32,.20)"/>
  <text x="12" y="66" class="em" font-size="10" letter-spacing="1.2">CONDITION 01</text>
  <text x="12" y="82" class="ik" font-size="12.5">Every generated number carries its source</text>
  <text x="12" y="97" class="lb" font-size="10.5">prevents: a confident figure nobody can check</text>

  <!-- condition 02 -->
  <rect x="312" y="50" width="288" height="56" rx="4" fill="#EEE4CE" stroke="rgba(44,38,32,.20)"/>
  <text x="324" y="66" class="em" font-size="10" letter-spacing="1.2">CONDITION 02</text>
  <text x="324" y="82" class="ik" font-size="12.5">Thin evidence draws an abstention</text>
  <text x="324" y="97" class="lb" font-size="10.5">prevents: a fluent guess entering a capital decision</text>

  <!-- the gate -->
  <rect x="0" y="114" width="600" height="20" rx="4" fill="#22201C"/>
  <text x="12" y="128" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">Ship</text>
  <text x="46" y="128" fill="#DDD8CB" font-family="'IBM Plex Sans',sans-serif" font-size="10.5">&#8212; only once both are true. Until then the model was accurate and unusable.</text>
  <text x="588" y="128" fill="#CE9230" font-family="'IBM Plex Sans',sans-serif" font-size="10.5" text-anchor="end">cost: weeks of delay</text>
</svg>
