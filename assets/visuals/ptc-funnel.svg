<svg viewBox="0 0 1180 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: at the start, 100% of revenue sat on perpetual licences. Free tutorials and trainings let learners experience the product; that experience converted them to premium subscriptions — moving subscription from 0% to 64% of new bookings in five quarters. Pricing and packaging stayed with PTC leadership; the funnel design was Arpit's.">
  <rect width="1180" height="340" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="308" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd4{font-family:Georgia,serif;fill:#2C2620}
    .lb4{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik4{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
  </style>
  <text x="44" y="52" class="lb4" font-size="12" letter-spacing="3">THE DESIGN ARGUMENT THAT PAID THE BILLS</text>
  <text x="44" y="86" class="hd4" font-size="28">The funnel was the product pitch.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <rect x="44" y="140" width="240" height="96" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="66" y="168" class="lb4" font-size="11" letter-spacing="2">THE START</text>
  <text x="66" y="194" class="ik4" font-size="15">100% perpetual licences</text>
  <text x="66" y="216" class="lb4" font-size="11.5">pay once, own forever &#8212; no recurring revenue</text>

  <rect x="330" y="140" width="250" height="96" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="352" y="168" class="lb4" font-size="11" letter-spacing="2">THE HOOK</text>
  <text x="352" y="194" class="ik4" font-size="15">Free tutorials &amp; trainings</text>
  <text x="352" y="216" class="lb4" font-size="11.5">learning made visible and habitual</text>

  <rect x="626" y="140" width="250" height="96" rx="8" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
  <text x="648" y="168" class="lb4" font-size="11" letter-spacing="2">THE CONVERSION</text>
  <text x="648" y="194" class="ik4" font-size="15">Experience converts</text>
  <text x="648" y="216" class="lb4" font-size="11.5">the funnel sells, not the sales pitch</text>

  <rect x="922" y="140" width="214" height="96" rx="8" fill="#F2F7F4" stroke="#2F5D52" stroke-width="1.5"/>
  <text x="944" y="168" class="lb4" font-size="11" letter-spacing="2">FIVE QUARTERS LATER</text>
  <text x="944" y="198" class="ik4" font-size="20" font-weight="600">0% &#8594; 64%</text>
  <text x="944" y="220" class="lb4" font-size="11.5">of new bookings on subscription</text>

  <g stroke="#998D78" stroke-width="1.5" fill="none">
    <path d="M 284 188 H 324"/><path d="M 580 188 H 620"/><path d="M 876 188 H 916"/>
  </g>
  <g fill="#998D78">
    <path d="M 324 188 l -8 -4 v 8 z"/><path d="M 620 188 l -8 -4 v 8 z"/><path d="M 916 188 l -8 -4 v 8 z"/>
  </g>

  <text x="44" y="284" class="lb4" font-size="12" font-style="italic">Q3 2017 &#8594; Q3 2018 &#183; existing customers protected for 24 months &#183; the free-to-paid path was mine to design;</text>
  <text x="44" y="304" class="lb4" font-size="12" font-style="italic">pricing and packaging stayed with PTC leadership.</text>
</svg>
