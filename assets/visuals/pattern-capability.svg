<svg viewBox="0 0 1280 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The Capability Contract pattern</title>
  <desc id="d">An AI capability contract: an in-scope checklist, an out-of-scope list that routes onward, and a clean hand-off to a human specialist.</desc>
  <rect x="0" y="0" width="1280" height="400" fill="#F4ECDA"/>

  <!-- Title block -->
  <text x="36" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#2C2620">The Capability Contract</text>
  <text x="36" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#6A6052">What it does, where it taps out &#8212; stated up front.</text>
  <line x1="36" y1="126" x2="1244" y2="126" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>

  <!-- ===== LEFT: In scope ===== -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="430" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#494338">IN SCOPE</text>

    <!-- Row 1 -->
    <rect x="24" y="60" width="382" height="44" rx="7" fill="#F4ECDA" stroke="#24473F" stroke-width="1.5"/>
    <circle cx="50" cy="82" r="11" fill="#24473F"/>
    <path d="M 45 82 L 49 86 L 56 78" fill="none" stroke="#F4ECDA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2C2620">Score standard deals</text>

    <!-- Row 2 -->
    <rect x="24" y="116" width="382" height="44" rx="7" fill="#F4ECDA" stroke="#24473F" stroke-width="1.5"/>
    <circle cx="50" cy="138" r="11" fill="#24473F"/>
    <path d="M 45 138 L 49 142 L 56 134" fill="none" stroke="#F4ECDA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2C2620">Price liquid assets</text>

    <text x="24" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#494338">Confident &#8212; handled end to end.</text>
  </g>

  <!-- connector -->
  <path d="M 478 257 H 524" fill="none" stroke="rgba(44,38,32,0.12)" stroke-width="2"/>
  <path d="M 518 251 L 526 257 L 518 263 Z" fill="#494338"/>

  <!-- ===== MIDDLE: Out of scope ===== -->
  <g transform="translate(534,150)">
    <rect x="0" y="0" width="386" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#494338">OUT OF SCOPE</text>

    <!-- Row 1 -->
    <rect x="24" y="60" width="338" height="44" rx="7" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <circle cx="48" cy="82" r="8" fill="none" stroke="#494338" stroke-width="1.5"/>
    <line x1="44" y1="82" x2="52" y2="82" stroke="#494338" stroke-width="1.5" stroke-linecap="round"/>
    <text x="68" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#6A6052">Illiquid assets</text>
    <path d="M 312 82 H 336" fill="none" stroke="#CE9230" stroke-width="2"/>
    <path d="M 332 76 L 340 82 L 332 88 Z" fill="#CE9230"/>

    <!-- Row 2 -->
    <rect x="24" y="116" width="338" height="44" rx="7" fill="#F4ECDA" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <circle cx="48" cy="138" r="8" fill="none" stroke="#494338" stroke-width="1.5"/>
    <line x1="44" y1="138" x2="52" y2="138" stroke="#494338" stroke-width="1.5" stroke-linecap="round"/>
    <text x="68" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#6A6052">Novel structures</text>
    <path d="M 312 138 H 336" fill="none" stroke="#CE9230" stroke-width="2"/>
    <path d="M 332 132 L 340 138 L 332 144 Z" fill="#CE9230"/>

    <text x="24" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#CE9230">hand to a human</text>
  </g>

  <!-- connector -->
  <path d="M 928 257 H 974" fill="none" stroke="rgba(44,38,32,0.12)" stroke-width="2"/>
  <path d="M 968 251 L 976 257 L 968 263 Z" fill="#494338"/>

  <!-- ===== RIGHT: Hand-off ===== -->
  <g transform="translate(984,150)">
    <rect x="0" y="0" width="260" height="214" rx="10" fill="#EEE4CE" stroke="rgba(44,38,32,0.12)" stroke-width="1"/>
    <text x="22" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.5" fill="#494338">HAND-OFF</text>

    <!-- routed hand-off card -->
    <rect x="22" y="58" width="216" height="118" rx="8" fill="#F4ECDA" stroke="#24473F" stroke-width="1.5"/>

    <!-- person glyph: head + shoulders -->
    <circle cx="130" cy="98" r="18" fill="#24473F"/>
    <path d="M 100 146 A 30 30 0 0 1 160 146 Z" fill="#24473F"/>

    <text x="130" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2C2620">Routed to a specialist</text>

    <text x="130" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6A6052">Re-routed, not abandoned.</text>
  </g>
</svg>
