<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: three requested features — assign, approve, escalate — each crossed out and labelled as a manager wearing a different name, all replaced by one mechanism: visibility. Commitments are published in the open; you see what is open and pick it up. Eight modules — staffing, comp, OKRs, onboarding and four more — speak one object model.">
  <rect width="1180" height="400" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="368" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd{font-family:Georgia,serif;fill:#2C2620}
    .lb{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>
  <text x="44" y="52" class="lb" font-size="12" letter-spacing="3">THE JOB WAS SAYING NO</text>
  <text x="44" y="86" class="hd" font-size="28">Every obvious feature was a manager wearing a different name.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- three rejected features -->
  <g>
    <rect x="44" y="136" width="200" height="72" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="64" y="166" class="ik" font-size="15">Assign</text>
    <text x="64" y="186" class="lb" font-size="11">who does the work</text>
    <line x1="52" y1="200" x2="236" y2="144" stroke="#C0512B" stroke-width="1.5"/>

    <rect x="268" y="136" width="200" height="72" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="288" y="166" class="ik" font-size="15">Approve</text>
    <text x="288" y="186" class="lb" font-size="11">who may proceed</text>
    <line x1="276" y1="200" x2="460" y2="144" stroke="#C0512B" stroke-width="1.5"/>

    <rect x="492" y="136" width="200" height="72" rx="7" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="512" y="166" class="ik" font-size="15">Escalate</text>
    <text x="512" y="186" class="lb" font-size="11">who settles it</text>
    <line x1="500" y1="200" x2="684" y2="144" stroke="#C0512B" stroke-width="1.5"/>
  </g>
  <text x="44" y="234" class="em" font-size="12" font-style="italic">each one is a boss smuggled back in through the side door &#8212; refused</text>

  <!-- the replacement -->
  <rect x="760" y="128" width="376" height="106" rx="9" fill="#22201C"/>
  <text x="782" y="158" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="16">Visibility instead</text>
  <text x="782" y="182" fill="#DAD4C6" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">commitments, published in the open &#8212; not tasks handed down.</text>
  <text x="782" y="200" fill="#DAD4C6" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">You see what&#8217;s open, and you pick it up.</text>
  <text x="782" y="222" fill="#CE9230" font-family="'IBM Plex Sans',sans-serif" font-size="11.5">salaries, finances, assignments &#8212; open to everyone</text>
  <path d="M 700 172 H 754" stroke="#494338" stroke-width="1.5" fill="none"/>
  <path d="M 754 172 l -8 -4 v 8 z" fill="#494338"/>

  <!-- the modules on one object model -->
  <g>
    <rect x="44" y="272" width="1092" height="30" rx="5" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="590" y="292" class="lb" font-size="12" text-anchor="middle" letter-spacing="1">ONE OBJECT MODEL &#8212; the org can rebuild its own process with nobody in the room to arbitrate</text>
    <g>
      <rect x="80" y="318" width="120" height="34" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
      <text x="140" y="340" class="ik" font-size="12.5" text-anchor="middle">Staffing</text>
      <rect x="220" y="318" width="120" height="34" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
      <text x="280" y="340" class="ik" font-size="12.5" text-anchor="middle">Comp</text>
      <rect x="360" y="318" width="120" height="34" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
      <text x="420" y="340" class="ik" font-size="12.5" text-anchor="middle">OKRs</text>
      <rect x="500" y="318" width="120" height="34" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,.16)"/>
      <text x="560" y="340" class="ik" font-size="12.5" text-anchor="middle">Onboarding</text>
      <rect x="640" y="318" width="150" height="34" rx="5" fill="#F4ECDA" stroke="rgba(44,38,32,.16)" stroke-dasharray="4 3"/>
      <text x="715" y="340" class="lb" font-size="12.5" text-anchor="middle">+ 4 more modules</text>
    </g>
    <g stroke="#494338" stroke-width="1" fill="none" opacity=".55">
      <path d="M 140 318 V 302"/><path d="M 280 318 V 302"/><path d="M 420 318 V 302"/><path d="M 560 318 V 302"/><path d="M 715 318 V 302"/>
    </g>
  </g>
  <text x="860" y="340" class="lb" font-size="12" font-style="italic">designed for 200 &#183; 250 run on it today &#183; 0 managers</text>
</svg>
