<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: five platforms consolidate into one over 24 months. First one skill graph every platform maps onto, so merging is a data migration, not a turf war. Then four sunsets in sequence, each with its users landed before the portal goes dark. The survivor is named by research — customers called everything PTC University — with a homepage keyed to each company's licence. 150,000 active learners migrated.">
  <rect width="1180" height="400" fill="#F4ECDA"/>
  <rect x="16" y="16" width="1148" height="368" fill="none" stroke="rgba(44,38,32,0.12)"/>
  <style>
    .hd3{font-family:Georgia,serif;fill:#2C2620}
    .lb3{font-family:'IBM Plex Sans',sans-serif;fill:#6A6052}
    .ik3{font-family:'IBM Plex Sans',sans-serif;fill:#2C2620}
    .em3{font-family:'IBM Plex Sans',sans-serif;fill:#C0512B}
  </style>
  <text x="44" y="52" class="lb3" font-size="12" letter-spacing="3">FIVE PLATFORMS &#8594; ONE &#183; 24 MONTHS &#183; 150K ACTIVE LEARNERS</text>
  <text x="44" y="86" class="hd3" font-size="28">The switch-off ladder.</text>
  <line x1="44" y1="104" x2="1136" y2="104" stroke="rgba(44,38,32,0.12)"/>

  <!-- step 0: the data model -->
  <rect x="44" y="130" width="270" height="76" rx="8" fill="#22201C"/>
  <text x="66" y="158" fill="#EFE6D2" font-family="'IBM Plex Sans',sans-serif" font-size="14">First: one data model</text>
  <text x="66" y="178" fill="#B6A98D" font-family="'IBM Plex Sans',sans-serif" font-size="11">one skill graph every platform mapped onto &#8212;</text>
  <text x="66" y="194" fill="#B6A98D" font-family="'IBM Plex Sans',sans-serif" font-size="11">merging became a data migration, not a turf war</text>

  <!-- the ladder: four sunsets -->
  <g>
    <rect x="360" y="130" width="168" height="48" rx="6" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="376" y="150" class="ik3" font-size="12.5">Sunset 1</text>
    <text x="376" y="168" class="lb3" font-size="10">users landed, then dark</text>

    <rect x="404" y="188" width="168" height="48" rx="6" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="420" y="208" class="ik3" font-size="12.5">Sunset 2</text>
    <text x="420" y="226" class="lb3" font-size="10">users landed, then dark</text>

    <rect x="448" y="246" width="168" height="48" rx="6" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="464" y="266" class="ik3" font-size="12.5">Sunset 3</text>
    <text x="464" y="284" class="lb3" font-size="10">users landed, then dark</text>

    <rect x="492" y="304" width="168" height="48" rx="6" fill="#EEE4CE" stroke="rgba(44,38,32,.16)"/>
    <text x="508" y="324" class="ik3" font-size="12.5">Sunset 4</text>
    <text x="508" y="342" class="lb3" font-size="10">users landed, then dark</text>
  </g>
  <text x="360" y="378" class="em3" font-size="11.5" font-style="italic">each VP watched their users land softly before their portal went dark</text>

  <!-- the survivor -->
  <rect x="742" y="170" width="394" height="140" rx="9" fill="#F2F7F4" stroke="#2F5D52" stroke-width="1.5"/>
  <text x="764" y="200" class="ik3" font-size="16" font-weight="600">One front door: &#8220;PTC University&#8221;</text>
  <text x="764" y="224" class="lb3" font-size="12">named by research &#8212; usability testing kept showing</text>
  <text x="764" y="242" class="lb3" font-size="12">customers didn&#8217;t use our product names at all</text>
  <text x="764" y="268" class="lb3" font-size="12">homepage keyed to each company&#8217;s licence:</text>
  <text x="764" y="286" class="lb3" font-size="12">you see what you bought, the rest behind &#8220;Explore&#8221;</text>

  <g stroke="#998D78" stroke-width="1.5" fill="none">
    <path d="M 314 168 H 354"/>
    <path d="M 660 328 C 700 328 706 250 736 240"/>
  </g>
  <g fill="#998D78">
    <path d="M 354 168 l -8 -4 v 8 z"/><path d="M 736 240 l -8 0 3 7 z"/>
  </g>
</svg>
