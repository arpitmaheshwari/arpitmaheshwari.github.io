<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pages</title>
<style>html,body{margin:0}iframe{border:0;width:1440px;height:22000px;display:block}</style></head><body>
<pre id="out">PENDING</pre>
<script>
var P=['ptc','o2','adtech','fintech','orgos','vc-diligence'];
var res=[];
function step(i){
  if(i>=P.length){document.getElementById('out').textContent=JSON.stringify(res,null,1);document.title='DONE';return;}
  var f=document.createElement('iframe');
  f.src='/case-studies/'+P[i]+'.html';
  f.onload=function(){setTimeout(function(){
    var d=f.contentDocument, dl=d.querySelector('.case-vitals');
    if(!dl){res.push({page:P[i],ERROR:'no vitals'});f.remove();return step(i+1);}
    var w=f.contentWindow, cs=w.getComputedStyle(dl), r=dl.getBoundingClientRect();
    var contentRight=r.x+r.width-parseFloat(cs.borderRightWidth)-parseFloat(cs.paddingRight);
    var kids=[].slice.call(dl.children);
    var rows={};
    kids.forEach(function(k){var kr=k.getBoundingClientRect();var key=Math.round(kr.y);(rows[key]=rows[key]||[]).push(kr);});
    var keys=Object.keys(rows).map(Number).sort(function(a,b){return a-b;});
    var first=rows[keys[0]], lastOfFirst=first[first.length-1];
    var ws=kids.map(function(k){return k.getBoundingClientRect().width;});
    res.push({
      page:P[i], cells:kids.length, rows:keys.length, perRow:keys.map(function(k){return rows[k].length;}),
      maxW:+Math.max.apply(null,ws).toFixed(1), minW:+Math.min.apply(null,ws).toFixed(1),
      ratio:+(Math.max.apply(null,ws)/Math.min.apply(null,ws)).toFixed(2),
      row1LastRightX:+(lastOfFirst.x+lastOfFirst.width).toFixed(1),
      cardContentRightX:+contentRight.toFixed(1),
      row1LastHasBorder: w.getComputedStyle(kids[first.length-1]).borderRightWidth,
      strayTerminalDivider: parseFloat(w.getComputedStyle(kids[first.length-1]).borderRightWidth)>0 &&
                            Math.abs((lastOfFirst.x+lastOfFirst.width)-contentRight)<1.5
    });
    f.remove(); step(i+1);
  },900);};
  document.body.appendChild(f);
}
step(0);
</script></body></html>
