<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>indep-prox-probe</title>
<style>html,body{margin:0;padding:0}iframe{border:0;display:block}</style>
</head><body>
<iframe id="fw" src="/writing/" width="1440" height="2400"></iframe>
<iframe id="fr" src="/resources/" width="1440" height="2400"></iframe>
<pre id="out">PENDING</pre>
<script>
function r(n){return Math.round(n*100)/100;}
function measure(doc, gridSel, headSel, label){
  var o = {label:label, ok:false};
  var grid = doc.querySelector(gridSel);
  if(!grid){o.err='grid not found: '+gridSel; return o;}
  var html = doc.documentElement;
  o.dataTheme = html.getAttribute('data-theme');
  o.bodyClass = doc.body.className;
  o.innerWidth = doc.defaultView.innerWidth;
  var gr = grid.getBoundingClientRect();
  o.gridRect = {t:r(gr.top), b:r(gr.bottom), w:r(gr.width)};
  var cs = doc.defaultView.getComputedStyle(grid);
  o.gridComputedGap = cs.rowGap + ' / ' + cs.columnGap;
  o.gridDisplay = cs.display;
  o.gridCols = cs.gridTemplateColumns;

  var cards = Array.prototype.slice.call(grid.querySelectorAll(':scope > a, :scope > div'));
  o.cardCount = cards.length;
  o.cardClasses = cards.map(function(c){return c.className;});
  var rects = cards.map(function(c){var b=c.getBoundingClientRect();return {t:r(b.top),b:r(b.bottom),h:r(b.height)};});
  o.cardRects = rects;
  // measured inter-card gaps from rendered rects
  o.itemGaps = [];
  for(var i=1;i<rects.length;i++){ o.itemGaps.push(r(rects[i].t - rects[i-1].b)); }

  // per-card inner padding: computed AND measured inset to first/last child
  o.cardPadding = cards.map(function(c){
    var s = doc.defaultView.getComputedStyle(c);
    var cb = c.getBoundingClientRect();
    var kids = Array.prototype.slice.call(c.children);
    var res = {computed:[s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft].join(' ')};
    if(kids.length){
      var f = kids[0].getBoundingClientRect();
      var l = kids[kids.length-1].getBoundingClientRect();
      res.measuredInsetTop = r(f.top - cb.top);
      res.measuredInsetBottom = r(cb.bottom - l.bottom);
      // horizontal inset too
      res.measuredInsetLeft = r(f.left - cb.left);
    }
    return res;
  });

  // heading -> grid gap
  var head = headSel ? doc.querySelector(headSel) : null;
  if(head){
    var hr = head.getBoundingClientRect();
    o.headingText = (head.textContent||'').trim().slice(0,60);
    o.headingRect = {t:r(hr.top), b:r(hr.bottom)};
    o.headingToGridGap = r(gr.top - hr.bottom);
    var hs = doc.defaultView.getComputedStyle(head);
    o.headingMarginBottom = hs.marginBottom;
  } else { o.headingNote = 'no heading matched '+headSel; }

  // what is the nearest preceding sibling of the grid?
  var prev = grid.previousElementSibling;
  if(prev){
    var pr = prev.getBoundingClientRect();
    o.prevSibling = {tag:prev.tagName, cls:prev.className, txt:(prev.textContent||'').trim().slice(0,50), gapToGrid: r(gr.top - pr.bottom)};
  }
  o.ok = true;
  return o;
}
function go(){
  var out = {};
  try{
    var dw = document.getElementById('fw').contentDocument;
    out.writing = measure(dw, '.xi-writing-011', '.section-title.xi-writing-010', '/writing/');
    // also: does .card-p32 exist there
    out.writing.cardP32Count = dw.querySelectorAll('.card-p32').length;
  }catch(e){out.writingErr = String(e);}
  try{
    var dr = document.getElementById('fr').contentDocument;
    out.resources = measure(dr, '.xi-resources-007', '.section-title', '/resources/');
    out.resources.cardP32Count = dr.querySelectorAll('.card-p32').length;
  }catch(e){out.resourcesErr = String(e);}
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
}
var n=0;
function tick(){ n++; var a=document.getElementById('fw').contentDocument, b=document.getElementById('fr').contentDocument;
  if(a && b && a.readyState==='complete' && b.readyState==='complete'){ setTimeout(go, 400); }
  else if(n<60){ setTimeout(tick, 100); } else { document.getElementById('out').textContent='TIMEOUT'; } }
tick();
</script>
</body></html>
